name: GHCR Execution Read Release

# Internal builds publish one selected native platform from a trusted main
# workflow. Dispatch supplies the existing task authorization. This workflow
# never publishes main/latest or certifies a public distribution.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character source commit to package.
        required: true
        type: string
      source_ref:
        description: Exact fork tag ref resolving to source_sha.
        required: true
        type: string
      release_tag:
        description: Fork image tag, vYYYY.M.D[.N]-ragnos.N.
        required: true
        type: string
      platform:
        description: Target native Linux platform.
        required: true
        default: linux/amd64
        type: choice
        options: [linux/amd64, linux/arm64]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'ghcr-execution-read-publication' || format('ghcr-execution-read-pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/ragnos-labs/hermes-agent
  CONTRACT_VERSION: hermes.execution.read.v1
  ACTION_CONTRACT_VERSION: hermes.execution.action.v1
  SCHEMA_PATH: hermes_cli/execution_contract_schemas/hermes.execution.read.v1.schema.json
  SCHEMA_SHA256: 7b2c4569d52a048c31a5a42861817b748e5742ce6cac6eafba1d41dc090340c3
  ACTION_SCHEMA_PATH: hermes_cli/execution_contract_schemas/hermes.execution.action.v1.schema.json
  ACTION_SCHEMA_SHA256: bcbc0d307b9c605a722c6ea805ef27741a35c4c75d07c32c645d0507c3bf9e9b

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      source_ref: ${{ steps.source.outputs.source_ref }}
      release_tag: ${{ steps.source.outputs.release_tag }}
      platform: ${{ steps.source.outputs.platform }}
      schema_sha256: ${{ env.SCHEMA_SHA256 }}
      action_schema_sha256: ${{ env.ACTION_SCHEMA_SHA256 }}
    steps:
      - name: Resolve source and trusted workflow binding
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            [ "$REPOSITORY" = ragnos-labs/hermes-agent ]
            [ "$EVENT_REF" = refs/heads/main ]
            [ "$REF_PROTECTED" = true ]
            [ "$EVENT_SHA" = "$WORKFLOW_SHA" ]
            [ "$WORKFLOW_REF" = ragnos-labs/hermes-agent/.github/workflows/ghcr-execution-read-release.yml@refs/heads/main ]
            [[ "$RELEASE_TAG" =~ ^v[0-9]{4}\.[0-9]+\.[0-9]+(\.[0-9]+)?-ragnos\.[1-9][0-9]*$ ]]
            [ "$SOURCE_REF" = "refs/tags/$RELEASE_TAG" ]
          else
            [ "$EVENT_NAME" = pull_request ]
            SOURCE_SHA="$PR_HEAD_SHA"
            SOURCE_REF="refs/pull/$PR_NUMBER/head"
            PLATFORM=linux/amd64
          fi
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PLATFORM" = linux/amd64 || "$PLATFORM" = linux/arm64 ]]
          {
            echo "source_sha=$SOURCE_SHA"
            echo "source_ref=$SOURCE_REF"
            echo "release_tag=$RELEASE_TAG"
            echo "platform=$PLATFORM"
          } >> "$GITHUB_OUTPUT"
      - name: Check out workflow revision
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Fence workflow to current main
        if: github.event_name == 'workflow_dispatch'
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main
          [ "$(git rev-parse 'HEAD^{commit}')" = "$WORKFLOW_SHA" ]
          [ "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$WORKFLOW_SHA" ]

  conformance:
    name: Execution-read conformance and package proof
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SCHEMA_SHA256: ${{ needs.resolve.outputs.schema_sha256 }}
      ACTION_SCHEMA_SHA256: ${{ needs.resolve.outputs.action_schema_sha256 }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove source ref, commit, tree, contract, and schema
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          RELEASE_SOURCE_REF: ${{ needs.resolve.outputs.source_ref }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse 'HEAD^{commit}')"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          git fetch --force --no-tags origin "$RELEASE_SOURCE_REF"
          [ "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$SOURCE_SHA" ]
          [ "$checked_out_sha" = "$SOURCE_SHA" ] || {
            echo "::error::Checkout mismatch: got $checked_out_sha, expected $SOURCE_SHA."
            exit 1
          }
          printf '%s  %s\n' "$SCHEMA_SHA256" "$SCHEMA_PATH" | sha256sum -c -
          printf '%s  %s\n' "$ACTION_SCHEMA_SHA256" "$ACTION_SCHEMA_PATH" | sha256sum -c -
          python3 - <<'PY'
          from hermes_cli.execution_contract import (
              ACTION_CONTRACT_VERSION,
              CONTRACT_VERSION,
              action_contract_schema,
          )
          assert CONTRACT_VERSION == "hermes.execution.read.v1", CONTRACT_VERSION
          assert ACTION_CONTRACT_VERSION == "hermes.execution.action.v1", ACTION_CONTRACT_VERSION
          assert action_contract_schema()["$id"].endswith(
              "hermes.execution.action.v1.schema.json"
          )
          PY
          {
            echo "### Exact source proof"
            echo "- ref: \`$RELEASE_SOURCE_REF\`"
            echo "- commit: \`$SOURCE_SHA\`"
            echo "- tree: \`$source_tree\`"
            echo "- contract: \`$CONTRACT_VERSION\`"
            echo "- schema SHA-256: \`$SCHEMA_SHA256\`"
            echo "- action contract: \`$ACTION_CONTRACT_VERSION\`"
            echo "- action schema SHA-256: \`$ACTION_SCHEMA_SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.9.28"

      - name: Set up Python 3.11
        uses: ./.github/actions/retry
        with:
          command: uv python install 3.11

      - name: Install conformance dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra dev --extra messaging

      - name: Run execution read/action contract and API conformance
        run: |
          scripts/run_tests.sh \
            tests/hermes_cli/test_execution_contract.py \
            tests/gateway/test_api_server_execution_contract.py

  image:
    needs: [resolve, conformance]
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ragnos-labs/hermes-agent'
    runs-on: ${{ needs.resolve.outputs.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
      PLATFORM: ${{ needs.resolve.outputs.platform }}
    steps:
      - name: Check out trusted publication tools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          path: policy
          persist-credentials: false
      - name: Fence publication workflow before effects
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          git -C policy fetch --no-tags origin refs/heads/main
          [ "$(git -C policy rev-parse 'FETCH_HEAD^{commit}')" = "$WORKFLOW_SHA" ]
      - name: Set up ORAS
        uses: oras-project/setup-oras@0d9191fa0dd41eaefe9e28b375a02290706ce51d # upstream-main-2026-08-06
        with:
          version: 1.3.3
      - name: Log in to fork-owned GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bccd # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconcile existing source and release tags
        id: preflight
        run: python3 policy/scripts/ci/publish_execution_image.py preflight
      - name: Check out exact source
        if: steps.preflight.outputs.build == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate exact source and native target
        if: steps.preflight.outputs.build == 'true'
        env:
          SOURCE_REF: ${{ needs.resolve.outputs.source_ref }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          git -C source fetch --no-tags origin "$SOURCE_REF"
          [ "$(git -C source rev-parse 'FETCH_HEAD^{commit}')" = "$SOURCE_SHA" ]
          [ "$(git -C source rev-parse 'HEAD^{commit}')" = "$SOURCE_SHA" ]
          case "$PLATFORM" in
            linux/amd64) [ "$RUNNER_ARCH" = X64 ] ;;
            linux/arm64) [ "$RUNNER_ARCH" = ARM64 ] ;;
            *) exit 1 ;;
          esac
      - name: Set up Docker Buildx
        if: steps.preflight.outputs.build == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build selected platform once without publishing
        if: steps.preflight.outputs.build == 'true'
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: source
          file: source/Dockerfile
          outputs: |
            type=oci,dest=${{ runner.temp }}/execution-image.tar
            type=docker,dest=${{ runner.temp }}/execution-image-docker.tar
          provenance: false
          sbom: false
          platforms: ${{ env.PLATFORM }}
          tags: ${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/ragnos-labs/hermes-agent
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            io.ragnos.hermes.execution.contract=${{ env.CONTRACT_VERSION }}
            io.ragnos.hermes.execution.schema-sha256=${{ env.SCHEMA_SHA256 }}
            io.ragnos.hermes.execution.action-contract=${{ env.ACTION_CONTRACT_VERSION }}
            io.ragnos.hermes.execution.action-schema-sha256=${{ env.ACTION_SCHEMA_SHA256 }}
            io.ragnos.hermes.execution.action-source-sha=${{ env.SOURCE_SHA }}
          build-args: HERMES_GIT_SHA=${{ env.SOURCE_SHA }}
      - name: Prove packaged contracts in the selected image
        env:
          BUILD: ${{ steps.preflight.outputs.build }}
          EXISTING_DIGEST: ${{ steps.preflight.outputs.digest }}
        run: |
          set -euo pipefail
          if [ "$BUILD" = true ]; then
            docker load --input "$RUNNER_TEMP/execution-image-docker.tar"
            image="$IMAGE_NAME:$RELEASE_TAG"
          else
            image="$IMAGE_NAME@$EXISTING_DIGEST"
            docker pull --platform "$PLATFORM" "$image"
          fi
          docker run --rm --network none -i \
            -e EXPECTED_SOURCE_SHA="$SOURCE_SHA" \
            -e SCHEMA_SHA256="$SCHEMA_SHA256" \
            -e ACTION_SCHEMA_SHA256="$ACTION_SCHEMA_SHA256" \
            --entrypoint /opt/hermes/.venv/bin/python "$image" - <<'PY'
          import hashlib
          import os
          from importlib.resources import files
          from pathlib import Path
          from hermes_cli.execution_contract import ACTION_CONTRACT_VERSION, CONTRACT_VERSION
          assert Path("/opt/hermes/.hermes_build_sha").read_text().strip() == os.environ["EXPECTED_SOURCE_SHA"]
          assert CONTRACT_VERSION == "hermes.execution.read.v1"
          assert ACTION_CONTRACT_VERSION == "hermes.execution.action.v1"
          for name, key in (("hermes.execution.read.v1", "SCHEMA_SHA256"), ("hermes.execution.action.v1", "ACTION_SCHEMA_SHA256")):
              path = files("hermes_cli").joinpath(f"execution_contract_schemas/{name}.schema.json")
              assert hashlib.sha256(path.read_bytes()).hexdigest() == os.environ[key]
          PY
      - name: Retain exact image bytes for delivery reconciliation
        if: steps.preflight.outputs.build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: execution-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/execution-image.tar
          retention-days: 1
          if-no-files-found: error
      - name: Publish exact digest and reconcile ambiguous pushes
        env:
          SOURCE_REF: ${{ needs.resolve.outputs.source_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          git -C policy fetch --no-tags origin refs/heads/main
          [ "$(git -C policy rev-parse 'FETCH_HEAD^{commit}')" = "$WORKFLOW_SHA" ]
          git -C policy fetch --no-tags origin "$SOURCE_REF"
          [ "$(git -C policy rev-parse 'FETCH_HEAD^{commit}')" = "$SOURCE_SHA" ]
          python3 policy/scripts/ci/publish_execution_image.py publish "$RUNNER_TEMP/execution-image.tar" "$RUNNER_TEMP/publication.json"
      - name: Retain actual publication result or pending digest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: execution-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication.json
          retention-days: 30
          if-no-files-found: warn
