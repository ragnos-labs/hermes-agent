          cmp -s "$RUNNER_TEMP/final-release-tag.json" "$RUNNER_TEMP/final-release-exact-manifest.json" || {
            record_failure release_exact_digest_mismatch release_verification_failed "The release tag raw manifest differs from its exact resolved digest; stop and reconcile."
            exit 1
          }

          AMD64_RUNTIME="$amd64_runtime" \
          ARM64_RUNTIME="$arm64_runtime" \
          MANIFEST_JSON="$RUNNER_TEMP/final-release-exact-manifest.json" \
          RECEIPT_PATH="$RECEIPT_PATH" \
          RELEASE_DIGEST="$final_release_digest" \
          SHA_DIGEST="$sha_digest" \
          SOURCE_SHA="$SOURCE_SHA" \
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.load(open(os.environ["MANIFEST_JSON"], encoding="utf-8"))
          manifests = payload.get("manifests", [])
          expected_runtime = {
              ("linux", "amd64"): os.environ["AMD64_RUNTIME"],
              ("linux", "arm64"): os.environ["ARM64_RUNTIME"],
          }
          actual_runtime = {
              (item.get("platform", {}).get("os"), item.get("platform", {}).get("architecture")): item["digest"]
              for item in manifests
              if item.get("platform", {}).get("os") == "linux"
          }
          attested = {
              item.get("annotations", {}).get("vnd.docker.reference.digest")
              for item in manifests
              if item.get("annotations", {}).get("vnd.docker.reference.type") == "attestation-manifest"
          }
          annotations = payload.get("annotations", {})
          assert actual_runtime == expected_runtime, (actual_runtime, expected_runtime)
          assert set(expected_runtime.values()).issubset(attested), attested
          assert annotations["org.opencontainers.image.revision"] == os.environ["SOURCE_SHA"]
          assert annotations["io.ragnos.hermes.execution.contract"] == "hermes.execution.read.v1"
          assert annotations["io.ragnos.hermes.execution.schema-sha256"] == "7b2c4569d52a048c31a5a42861817b748e5742ce6cac6eafba1d41dc090340c3"
          assert annotations["io.ragnos.hermes.execution.action-contract"] == "hermes.execution.action.v1"
          assert annotations["io.ragnos.hermes.execution.action-schema-sha256"] == os.environ["ACTION_SCHEMA_SHA256"]
          assert annotations["io.ragnos.hermes.execution.action-source-sha"] == os.environ["SOURCE_SHA"]

          receipt_path = Path(os.environ["RECEIPT_PATH"])
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          receipt["status"] = "complete"
          receipt["index_digest"] = os.environ["SHA_DIGEST"]
          receipt["tag_states"]["final"] = {
              "sha": {"state": "matching", "digest": os.environ["SHA_DIGEST"]},
              "release": {"state": "matching", "digest": os.environ["RELEASE_DIGEST"]},
          }
          receipt["recovery"] = {
              "state": "complete",
              "instruction": "No reconciliation required. This one authorized release attempt is terminal.",
          }
          receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

          echo "digest=$sha_digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Fork-owned GHCR publication"
            echo "- source ref: \`$SOURCE_REF\`"
            echo "- source revision: \`$SOURCE_SHA\`"
            echo "- contract: \`$CONTRACT_VERSION\`"
            echo "- schema SHA-256: \`$SCHEMA_SHA256\`"
            echo "- manifest digest: \`$sha_digest\`"
            echo "- immutable tag: \`$sha_ref\`"
            echo "- approved release tag: \`$release_ref\`"
            echo "- platforms: \`linux/amd64\`, \`linux/arm64\`"
            echo "- workflow revision: \`$WORKFLOW_SHA\`"
            echo "- receipt artifact: \`ghcr-execution-read-receipt-${RELEASE_TAG}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach authoritative receipt to the immutable index
        if: always()
        id: receipt
        env:
          RECEIPT_PATH: ${{ runner.temp }}/ghcr-execution-read-receipt.json
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          WORKFLOW_SHA: ${{ needs.resolve.outputs.workflow_sha }}
        run: |
          set -euo pipefail
          subject_digest="$(jq -r '[.index_digest, .tag_states.preflight.sha.digest, .tag_states.preflight.release.digest, .children.amd64.build_index_digest, .children.arm64.build_index_digest, .orphan_children.amd64.proof.build_index_digest, .orphan_children.arm64.proof.build_index_digest] | map(select(type == "string" and test("^sha256:[0-9a-f]{64}$"))) | first // ""' "$RECEIPT_PATH")"
          if ! [[ "$subject_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::notice::No registry object was delivered, so there is no immutable OCI subject for this no-mutation failure receipt."
            exit 0
          fi
          receipt_dir="$RUNNER_TEMP/oci-receipt"
          verify_dir="$RUNNER_TEMP/oci-receipt-verify"
          mkdir -p "$receipt_dir" "$verify_dir"
          cp "$RECEIPT_PATH" "$receipt_dir/receipt.json"
          cd "$receipt_dir"
          receipt_digest="$(timeout 120 oras attach \
            --artifact-type application/vnd.ragnos.hermes.execution.read.release-receipt.v1+json \
            --annotation "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --annotation "io.ragnos.hermes.release-tag=${RELEASE_TAG}" \
            --annotation "io.ragnos.hermes.workflow-revision=${WORKFLOW_SHA}" \
            --format go-template --template '{{.digest}}' \
            "${IMAGE_NAME}@${subject_digest}" \
            receipt.json:application/vnd.ragnos.hermes.execution.read.release-receipt.v1+json)"
          [[ "$receipt_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::Authoritative receipt could not be attached durably after bounded retry."
            exit 1
          }
          oras manifest fetch "${IMAGE_NAME}@${receipt_digest}" > "$RUNNER_TEMP/oci-receipt-manifest.json"
          [ "$(jq -r '.subject.digest' "$RUNNER_TEMP/oci-receipt-manifest.json")" = "$subject_digest" ]
          oras pull --output "$verify_dir" "${IMAGE_NAME}@${receipt_digest}"
          cmp -s receipt.json "$verify_dir/receipt.json"
          cp "$RUNNER_TEMP/oci-receipt-manifest.json" "$RUNNER_TEMP/ghcr-execution-read-receipt-oci-manifest.json"
          echo "digest=$receipt_digest" >> "$GITHUB_OUTPUT"
          {
            echo "- authoritative OCI receipt: \`${IMAGE_NAME}@${receipt_digest}\`"
            echo "- receipt subject: \`${IMAGE_NAME}@${subject_digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach authoritative action receipt to the immutable index
        if: steps.manifest.outputs.digest != ''
        id: action-receipt
        env:
          INDEX_DIGEST: ${{ steps.manifest.outputs.digest }}
          RECEIPT_PATH: ${{ runner.temp }}/ghcr-execution-action-receipt.json
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          WORKFLOW_RUN_ATTEMPT: ${{ needs.resolve.outputs.workflow_run_attempt }}
          WORKFLOW_RUN_ID: ${{ needs.resolve.outputs.workflow_run_id }}
          WORKFLOW_SHA: ${{ needs.resolve.outputs.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$INDEX_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$ACTION_SCHEMA_SHA256" "$ACTION_SCHEMA_PATH" | sha256sum -c -
          ACTION_CONTRACT_VERSION="$ACTION_CONTRACT_VERSION" \
          ACTION_SCHEMA_PATH="$ACTION_SCHEMA_PATH" \
          ACTION_SCHEMA_SHA256="$ACTION_SCHEMA_SHA256" \
          INDEX_DIGEST="$INDEX_DIGEST" \
          READ_CONTRACT_VERSION="$CONTRACT_VERSION" \
          READ_SCHEMA_SHA256="$SCHEMA_SHA256" \
          RECEIPT_PATH="$RECEIPT_PATH" \
          RELEASE_TAG="$RELEASE_TAG" \
          SOURCE_SHA="$SOURCE_SHA" \
          WORKFLOW_RUN_ATTEMPT="$WORKFLOW_RUN_ATTEMPT" \
          WORKFLOW_RUN_ID="$WORKFLOW_RUN_ID" \
          WORKFLOW_SHA="$WORKFLOW_SHA" \
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          schema = json.loads(Path(os.environ["ACTION_SCHEMA_PATH"]).read_text(encoding="utf-8"))
          receipt = {
              "receipt_version": "hermes.execution.action.release-receipt.v1",
              "status": "complete",
              "destination": "ghcr.io/ragnos-labs/hermes-agent",
              "release_tag": os.environ["RELEASE_TAG"],
              "source_sha": os.environ["SOURCE_SHA"],
              "workflow_sha": os.environ["WORKFLOW_SHA"],
              "workflow_run_id": os.environ["WORKFLOW_RUN_ID"],
              "workflow_run_attempt": os.environ["WORKFLOW_RUN_ATTEMPT"],
              "contract": os.environ["ACTION_CONTRACT_VERSION"],
              "schema_sha256": os.environ["ACTION_SCHEMA_SHA256"],
              "read_contract": os.environ["READ_CONTRACT_VERSION"],
              "read_schema_sha256": os.environ["READ_SCHEMA_SHA256"],
              "index_digest": os.environ["INDEX_DIGEST"],
          }
          definition = schema["$defs"]["releaseReceipt"]
          assert definition["additionalProperties"] is False
          assert set(receipt) == set(definition["required"])
          for name, value in receipt.items():
              rule = definition["properties"][name]
              if "$ref" in rule:
                  rule = schema["$defs"][rule["$ref"].rsplit("/", 1)[-1]]
              if "const" in rule:
                  assert value == rule["const"], (name, value)
              if "pattern" in rule:
                  assert re.fullmatch(rule["pattern"], value), (name, value)
          Path(os.environ["RECEIPT_PATH"]).write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

          receipt_dir="$RUNNER_TEMP/oci-action-receipt"
          verify_dir="$RUNNER_TEMP/oci-action-receipt-verify"
          mkdir -p "$receipt_dir" "$verify_dir"
          cp "$RECEIPT_PATH" "$receipt_dir/receipt.json"
          cd "$receipt_dir"
          receipt_digest="$(timeout 120 oras attach \
            --artifact-type application/vnd.ragnos.hermes.execution.action.release-receipt.v1+json \
            --annotation "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --annotation "io.ragnos.hermes.execution.action-contract=${ACTION_CONTRACT_VERSION}" \
            --annotation "io.ragnos.hermes.execution.action-schema-sha256=${ACTION_SCHEMA_SHA256}" \
            --annotation "io.ragnos.hermes.execution.action-source-sha=${SOURCE_SHA}" \
            --annotation "io.ragnos.hermes.release-tag=${RELEASE_TAG}" \
            --annotation "io.ragnos.hermes.workflow-revision=${WORKFLOW_SHA}" \
            --format go-template --template '{{.digest}}' \
            "${IMAGE_NAME}@${INDEX_DIGEST}" \
            receipt.json:application/vnd.ragnos.hermes.execution.action.release-receipt.v1+json)"
          [[ "$receipt_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::Authoritative action receipt could not be attached durably after bounded retry."
            exit 1
          }
          oras manifest fetch "${IMAGE_NAME}@${receipt_digest}" > "$RUNNER_TEMP/oci-action-receipt-manifest.json"
          jq -e \
            --arg contract "$ACTION_CONTRACT_VERSION" \
            --arg schema "$ACTION_SCHEMA_SHA256" \
            --arg source "$SOURCE_SHA" \
            --arg subject "$INDEX_DIGEST" \
            '.artifactType == "application/vnd.ragnos.hermes.execution.action.release-receipt.v1+json"
             and .subject.digest == $subject
             and .annotations["org.opencontainers.image.revision"] == $source
             and .annotations["io.ragnos.hermes.execution.action-contract"] == $contract
             and .annotations["io.ragnos.hermes.execution.action-schema-sha256"] == $schema
             and .annotations["io.ragnos.hermes.execution.action-source-sha"] == $source' \
            "$RUNNER_TEMP/oci-action-receipt-manifest.json" >/dev/null
          oras pull --output "$verify_dir" "${IMAGE_NAME}@${receipt_digest}"
          cmp -s receipt.json "$verify_dir/receipt.json"
          cp "$RUNNER_TEMP/oci-action-receipt-manifest.json" "$RUNNER_TEMP/ghcr-execution-action-receipt-oci-manifest.json"
          echo "digest=$receipt_digest" >> "$GITHUB_OUTPUT"
          {
            echo "- action contract: \`$ACTION_CONTRACT_VERSION\`"
            echo "- action schema SHA-256: \`$ACTION_SCHEMA_SHA256\`"
            echo "- authoritative action OCI receipt: \`${IMAGE_NAME}@${receipt_digest}\`"
            echo "- action receipt subject: \`${IMAGE_NAME}@${INDEX_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce final aggregate artifact cap
        if: always()
        run: |
          set -euo pipefail
          action_bytes=0
          read_bytes=0
          for candidate in \
            "$RUNNER_TEMP/ghcr-execution-action-receipt.json" \
            "$RUNNER_TEMP/ghcr-execution-action-receipt-oci-manifest.json"; do
            [ ! -e "$candidate" ] || action_bytes=$((action_bytes + $(stat -c %s "$candidate")))
          done
          for candidate in \
            "$RUNNER_TEMP/ghcr-execution-read-receipt.json" \
            "$RUNNER_TEMP/ghcr-execution-read-receipt-oci-manifest.json"; do
            [ ! -e "$candidate" ] || read_bytes=$((read_bytes + $(stat -c %s "$candidate")))
          done
          [ "$action_bytes" -le 1048576 ]
          [ "$read_bytes" -le 1048576 ]
          # Static upload ceilings include the 64 KiB launcher binding and the
          # separately gated 1 MiB Sigstore verification artifact.
          [ $((65536 + 262144 + 262144 + 524288 + 2 * 10485760 + 1048576 + 1048576 + 1048576)) -lt "$MAINTENANCE_MAX_ACTIONS_STORAGE_BYTES" ]

      - name: Upload durable machine-readable action receipt
        if: steps.action-receipt.outputs.digest != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghcr-execution-action-receipt-${{ needs.resolve.outputs.release_tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ghcr-execution-action-receipt.json
            ${{ runner.temp }}/ghcr-execution-action-receipt-oci-manifest.json
          if-no-files-found: error
          retention-days: 89

      - name: Upload durable machine-readable receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghcr-execution-read-receipt-${{ needs.resolve.outputs.release_tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ghcr-execution-read-receipt.json
            ${{ runner.temp }}/ghcr-execution-read-receipt-oci-manifest.json
          if-no-files-found: error
          retention-days: 89

      - name: Fail closed when an architecture proof is missing
        if: always() && steps.children.outputs.ready != 'true'
        run: |
          echo "::error::Both verified architecture proofs are required; recovery receipt was uploaded."
          exit 1

  sign:
    name: Sign and verify the immutable maintenance index
    if: >-
      needs.resolve.outputs.maintenance == 'true'
      && needs.authorize.result == 'success'
      && needs.release-lock.result == 'success'
      && needs.manifest.result == 'success'
      && needs.manifest.outputs.digest != ''
    needs: [resolve, authorize, release-lock, manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Verify pinned signing runner
        env:
          RUNNER_ARCH: ${{ runner.arch }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          [ "$RUNNER_OS" = "Linux" ]
          [ "$RUNNER_ARCH" = "X64" ]

      - name: Rebind exact maintenance subject
        env:
          APPROVAL_DIGEST: ${{ needs.authorize.outputs.approval_digest }}
          INDEX_DIGEST: ${{ needs.manifest.outputs.digest }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          SOURCE_TREE: ${{ needs.resolve.outputs.source_tree }}
          WORKFLOW_RUN_ATTEMPT: ${{ needs.resolve.outputs.workflow_run_attempt }}
        run: |
          set -euo pipefail
          [ "$SOURCE_SHA" = "$MAINTENANCE_SOURCE_SHA" ]
          [ "$SOURCE_TREE" = "$MAINTENANCE_SOURCE_TREE" ]
          [ "$RELEASE_TAG" = "$MAINTENANCE_RELEASE_TAG" ]
          [ "$WORKFLOW_RUN_ATTEMPT" = "1" ]
          [[ "$INDEX_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$APPROVAL_DIGEST" =~ ^[0-9a-f]{64}$ ]]

      - name: Log in to fork-owned GHCR for signature publication
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v3.1.3

      - name: Publish one keyless signature and verify Fulcio and Rekor proof
        env:
          APPROVAL_DIGEST: ${{ needs.authorize.outputs.approval_digest }}
          INDEX_DIGEST: ${{ needs.manifest.outputs.digest }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          SOURCE_TREE: ${{ needs.resolve.outputs.source_tree }}
        run: |
          set -euo pipefail
          identity="https://github.com/ragnos-labs/hermes-agent/.github/workflows/ghcr-execution-read-release.yml@refs/heads/main"
          issuer="https://token.actions.githubusercontent.com"
          subject="${IMAGE_NAME}@${INDEX_DIGEST}"
          bundle="$RUNNER_TEMP/hermes-maintenance-cosign-bundle.json"
          verified="$RUNNER_TEMP/hermes-maintenance-cosign-verify.json"
          tool_receipt="$RUNNER_TEMP/hermes-maintenance-signature-receipt.json"

          cosign version --json > "$RUNNER_TEMP/cosign-version.json"
          jq -e '.gitVersion == "v3.1.3"' "$RUNNER_TEMP/cosign-version.json" >/dev/null
          cosign_sha256="$(sha256sum "$(command -v cosign)" | cut -d' ' -f1)"
          [ "$cosign_sha256" = "4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71" ]

          # Exactly one signing request. Any ambiguous result is terminal and
          # never retried by this workflow.
          cosign sign --yes --bundle "$bundle" "$subject"
          cosign verify \
            --bundle "$bundle" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" \
            --output json \
            "$subject" > "$verified"

          jq -e '
            (.verificationMaterial.tlogEntries // []) | length > 0
            and all(.[]; .inclusionProof != null and .logIndex != null)
          ' "$bundle" >/dev/null
          jq -e 'type == "array" and length == 1' "$verified" >/dev/null

          jq -n \
            --arg approval_digest "$APPROVAL_DIGEST" \
            --arg cosign_action "7e8b541eb2e61bf99390e1afd4be13a184e9ebc5" \
            --arg cosign_binary_sha256 "$cosign_sha256" \
            --arg cosign_version "v3.1.3" \
            --arg identity "$identity" \
            --arg issuer "$issuer" \
            --arg index_digest "$INDEX_DIGEST" \
            --arg source_sha "$SOURCE_SHA" \
            --arg source_tree "$SOURCE_TREE" \
            '{receipt_version:"hermes.execution.read.maintenance-signature-receipt.v1",
              status:"verified",source_sha:$source_sha,source_tree:$source_tree,
              index_digest:$index_digest,approval_digest:$approval_digest,
              certificate_identity:$identity,certificate_oidc_issuer:$issuer,
              transparency_log:"rekor-public",
              tool:{version:$cosign_version,action_revision:$cosign_action,
                    binary_sha256:$cosign_binary_sha256}}' > "$tool_receipt"

      - name: Enforce signature evidence and aggregate upload caps
        run: |
          set -euo pipefail
          signature_bytes=0
          for candidate in \
            "$RUNNER_TEMP/hermes-maintenance-cosign-bundle.json" \
            "$RUNNER_TEMP/hermes-maintenance-cosign-verify.json" \
            "$RUNNER_TEMP/hermes-maintenance-signature-receipt.json"; do
            [ -f "$candidate" ]
            signature_bytes=$((signature_bytes + $(stat -c %s "$candidate")))
          done
          [ "$signature_bytes" -le 1048576 ]
          [ $((65536 + 262144 + 262144 + 524288 + 2 * 10485760 + 1048576 + 1048576 + 1048576)) -lt "$MAINTENANCE_MAX_ACTIONS_STORAGE_BYTES" ]

      - name: Upload verified maintenance signature evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes-maintenance-signature-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hermes-maintenance-cosign-bundle.json
            ${{ runner.temp }}/hermes-maintenance-cosign-verify.json
            ${{ runner.temp }}/hermes-maintenance-signature-receipt.json
          if-no-files-found: error
          retention-days: 89
