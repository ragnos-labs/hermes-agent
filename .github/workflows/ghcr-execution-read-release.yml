name: GHCR Execution Read Release

run-name: >-
  ${{ inputs.release_mode == 'maintenance_launcher'
      && format('hermes-maintenance-launcher-{0}', github.run_id)
      || inputs.release_mode == 'maintenance_child'
      && format('hermes-maintenance-child-{0}', inputs.launch_digest)
      || github.event_name == 'pull_request'
      && format('ghcr-execution-read-pr-{0}', github.event.pull_request.number)
      || format('ghcr-execution-read-{0}', inputs.release_tag) }}

# Fork-owned publication for the dependency-owned execution-read contract.
# Pull requests only validate: they have read-only permissions and never log in
# to a registry. Publishing is limited to an exact workflow_dispatch of this
# audited workflow on protected main. A dispatch confirmation records intent;
# it is not approval. Publication also fails closed unless the dedicated
# hermes-execution-read-release environment requires the RAGnos release operator,
# permits that operator to approve the bounded dispatch, disables administrator
# bypass, and has a main-only deployment policy. Protected fork-qualified tags
# and GHCR package-writer restrictions remain external release gates owned by
# the pilot. The -ragnos.N suffix keeps fork releases distinct from immutable
# NousResearch upstream tags.
# This workflow never creates main or latest tags.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      release_mode:
        description: Internal release phase. Leave ordinary for normal protected-main publication.
        required: true
        default: ordinary
        type: choice
        options:
          - ordinary
          - maintenance_launcher
          - maintenance_child
      source_sha:
        description: Exact 40-character source commit to package.
        required: true
        type: string
      source_ref:
        description: Exact fork release ref (refs/tags/vYYYY.M.D[.N]-ragnos.N) that resolves to source_sha.
        required: true
        type: string
      release_tag:
        description: Approved fork image tag (vYYYY.M.D[.N]-ragnos.N).
        required: true
        type: string
      confirm_publish:
        description: Intent only, not approval. Type publish ghcr.io/ragnos-labs/hermes-agent:<release_tag>.
        required: true
        type: string
      parent_run_id:
        description: Internal maintenance child binding; launcher supplies this value.
        required: false
        type: string
      parent_workflow_sha:
        description: Internal maintenance child binding; launcher supplies this value.
        required: false
        type: string
      launch_digest:
        description: Internal maintenance child binding; launcher supplies this value.
        required: false
        type: string
      launch_nonce:
        description: Exact one-use 64-hex maintenance launcher nonce.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Every dispatch can address the same immutable sha-SOURCE_SHA tag even when
  # the approved CalVer tags differ, so publication is globally serialized.
  group: >-
    ${{ inputs.release_mode == 'maintenance_launcher'
        && format('ghcr-execution-read-launcher-{0}', github.run_id)
        || github.event_name == 'workflow_dispatch'
        && 'ghcr-execution-read-publication'
        || format('ghcr-execution-read-pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/ragnos-labs/hermes-agent
  CONTRACT_VERSION: hermes.execution.read.v1
  ACTION_CONTRACT_VERSION: hermes.execution.action.v1
  ORAS_VERSION: 1.3.3
  SCHEMA_PATH: hermes_cli/execution_contract_schemas/hermes.execution.read.v1.schema.json
  SCHEMA_SHA256: 7b2c4569d52a048c31a5a42861817b748e5742ce6cac6eafba1d41dc090340c3
  ACTION_SCHEMA_PATH: hermes_cli/execution_contract_schemas/hermes.execution.action.v1.schema.json
  ACTION_SCHEMA_SHA256: bcbc0d307b9c605a722c6ea805ef27741a35c4c75d07c32c645d0507c3bf9e9b
  MAINTENANCE_SOURCE_SHA: 05b7574da33459304109582f23e70b155d13a6dc
  MAINTENANCE_SOURCE_TREE: 427f75a3c9e237ef8d19a608bf4e5b1d5bcb9f24
  MAINTENANCE_RELEASE_TAG: v2026.8.22-ragnos.1
  MAINTENANCE_READ_SCHEMA_SHA256: 7b2c4569d52a048c31a5a42861817b748e5742ce6cac6eafba1d41dc090340c3
  MAINTENANCE_ACTION_SCHEMA_SHA256: d7ff28de7a04b015005e8ef39df78a06766db6426ae91792c3d5f39a61966870
  MAINTENANCE_MAX_ACTIONS_STORAGE_BYTES: "26214400"
  MAINTENANCE_PROJECTED_MAX_MINUTES: "290"
  MAINTENANCE_PROJECTED_COST_CENTS: "2"
  MAINTENANCE_HARD_COST_CENTS: "500"

jobs:
  launcher:
    name: Launch one exact maintenance child
    if: github.event_name == 'workflow_dispatch' && inputs.release_mode == 'maintenance_launcher'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Validate launcher and dispatch child exactly once
        id: dispatch
        env:
          ACTOR: ${{ github.actor }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          INPUT_CONFIRM: ${{ inputs.confirm_publish }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_LAUNCH_NONCE: ${{ inputs.launch_nonce }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # shellcheck disable=SC2153
          set -euo pipefail
          [ "$REPOSITORY" = "ragnos-labs/hermes-agent" ]
          [ "$REPOSITORY_VISIBILITY" = "public" ]
          [ "$ACTOR" = "ragnos-dev" ]
          [ "$EVENT_REF" = "refs/heads/main" ]
          [ "$EVENT_SHA" = "$WORKFLOW_SHA" ]
          [ "$RUN_ATTEMPT" = "1" ]
          [[ "$INPUT_LAUNCH_NONCE" =~ ^[0-9a-f]{64}$ ]]
          # Fixed timeout graph: launcher 5; child admission/resolve/policy/conformance 45;
          # 2x build 100; authorize/lock/preflight 25; 2x publish 80;
          # manifest 25; maintenance-only signing 10. Public standard runners
          # have zero compute charge; conservatively price retained artifacts at
          # USD $0.008/GiB-day and round upward to whole cents.
          projected_minutes=$((5 + 5 + 5 + 5 + 30 + 2 * 50 + 5 + 10 + 10 + 2 * 40 + 25 + 10))
          projected_compute_cents=0
          projected_storage_cents=$(((MAINTENANCE_MAX_ACTIONS_STORAGE_BYTES * 89 * 8 + 10737418240 - 1) / 10737418240))
          projected_cost_cents=$((projected_compute_cents + projected_storage_cents))
          [ "$projected_minutes" = "$MAINTENANCE_PROJECTED_MAX_MINUTES" ]
          [ "$projected_cost_cents" = "$MAINTENANCE_PROJECTED_COST_CENTS" ]
          [ "$projected_cost_cents" -lt "$MAINTENANCE_HARD_COST_CENTS" ]
          [ "$INPUT_SOURCE_SHA" = "$MAINTENANCE_SOURCE_SHA" ]
          [ "$INPUT_SOURCE_REF" = "refs/tags/${MAINTENANCE_RELEASE_TAG}" ]
          [ "$INPUT_RELEASE_TAG" = "$MAINTENANCE_RELEASE_TAG" ]
          [ "$INPUT_CONFIRM" = "publish ${IMAGE_NAME}:${MAINTENANCE_RELEASE_TAG}" ]
          [ "$WORKFLOW_REF" = "ragnos-labs/hermes-agent/.github/workflows/ghcr-execution-read-release.yml@refs/heads/main" ]
          [ "$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$WORKFLOW_SHA" ]

          prior_runs="$RUNNER_TEMP/maintenance-prior-runs.json"
          gh api --paginate --slurp \
            "repos/${REPOSITORY}/actions/workflows/ghcr-execution-read-release.yml/runs?event=workflow_dispatch&branch=main&per_page=100" \
            > "$prior_runs"
          PRIOR_RUNS="$prior_runs" CURRENT_RUN_ID="$RUN_ID" python3 - <<'PY'
          import json
          import os

          pages = json.load(open(os.environ["PRIOR_RUNS"], encoding="utf-8"))
          runs = [run for page in pages for run in page.get("workflow_runs", [])]
          maintenance = [
              run for run in runs
              if run.get("display_title", "").startswith("hermes-maintenance-launcher-")
              or run.get("display_title", "").startswith("hermes-maintenance-child-")
          ]
          assert len(maintenance) == 1, maintenance
          assert str(maintenance[0]["id"]) == os.environ["CURRENT_RUN_ID"], maintenance[0]
          PY

          launch_digest="$(printf '%s\n' \
            "parent_run_id=${RUN_ID}" \
            "workflow_sha=${WORKFLOW_SHA}" \
            "source_sha=${MAINTENANCE_SOURCE_SHA}" \
            "source_tree=${MAINTENANCE_SOURCE_TREE}" \
            "release_tag=${MAINTENANCE_RELEASE_TAG}" \
            "read_schema=${MAINTENANCE_READ_SCHEMA_SHA256}" \
            "action_schema=${MAINTENANCE_ACTION_SCHEMA_SHA256}" \
            "launch_nonce=${INPUT_LAUNCH_NONCE}" \
            | sha256sum | cut -d' ' -f1)"
          [[ "$launch_digest" =~ ^[0-9a-f]{64}$ ]]

          request="$RUNNER_TEMP/maintenance-child-dispatch.json"
          response="$RUNNER_TEMP/maintenance-child-dispatch-response.json"
          jq -n \
            --arg ref main \
            --arg mode maintenance_child \
            --arg source_sha "$MAINTENANCE_SOURCE_SHA" \
            --arg source_ref "refs/tags/${MAINTENANCE_RELEASE_TAG}" \
            --arg release_tag "$MAINTENANCE_RELEASE_TAG" \
            --arg confirm "publish ${IMAGE_NAME}:${MAINTENANCE_RELEASE_TAG}" \
            --arg parent_run_id "$RUN_ID" \
            --arg parent_workflow_sha "$WORKFLOW_SHA" \
            --arg launch_digest "$launch_digest" \
            --arg launch_nonce "$INPUT_LAUNCH_NONCE" \
            '{ref: $ref, inputs: {
              release_mode: $mode,
              source_sha: $source_sha,
              source_ref: $source_ref,
              release_tag: $release_tag,
              confirm_publish: $confirm,
              parent_run_id: $parent_run_id,
              parent_workflow_sha: $parent_workflow_sha,
              launch_digest: $launch_digest,
              launch_nonce: $launch_nonce
            }}' > "$request"
          # One physical dispatch attempt. An ambiguous response is a terminal hold.
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --data-binary "@${request}" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/ghcr-execution-read-release.yml/dispatches" \
            > "$response"
          jq -e '.workflow_run_id | type == "number" and . > 0' "$response" >/dev/null
          child_run_id="$(jq -r .workflow_run_id "$response")"
          child_run="$RUNNER_TEMP/maintenance-child-run.json"
          for poll in $(seq 1 6); do
            if gh api "repos/${REPOSITORY}/actions/runs/${child_run_id}" > "$child_run"; then
              break
            fi
            [ "$poll" -lt 6 ] || {
              echo "::error::Returned child run identity could not be read back."
              exit 1
            }
            sleep 5
          done
          jq -e --arg id "$child_run_id" --arg sha "$WORKFLOW_SHA" \
            '(.id | tostring) == $id
             and .event == "workflow_dispatch"
             and .run_attempt == 1
             and .head_branch == "main"
             and .head_sha == $sha
             and (.actor.login | type == "string" and length > 0)
             and (.actor.id | type == "number")
             and .actor.type == "Bot"
             and (.triggering_actor.login | type == "string" and length > 0)
             and (.triggering_actor.id | type == "number")' "$child_run" >/dev/null
          receipt="$RUNNER_TEMP/maintenance-launch-binding.json"
          jq -n \
            --arg child_run_id "$child_run_id" \
            --arg launch_digest "$launch_digest" \
            --arg launch_nonce "$INPUT_LAUNCH_NONCE" \
            --arg parent_run_id "$RUN_ID" \
            --arg workflow_sha "$WORKFLOW_SHA" \
            --slurpfile child_run "$child_run" \
            '{receipt_version:"hermes.execution.read.maintenance-launch-binding.v1",
              parent_run_id:$parent_run_id,child_run_id:$child_run_id,
              workflow_sha:$workflow_sha,launch_digest:$launch_digest,launch_nonce:$launch_nonce,
              child_identity:{actor:$child_run[0].actor,triggering_actor:$child_run[0].triggering_actor}}' \
            > "$receipt"
          echo "child_run_id=$child_run_id" >> "$GITHUB_OUTPUT"
          echo "launch_digest=$launch_digest" >> "$GITHUB_OUTPUT"

      - name: Enforce launcher binding artifact cap
        run: |
          set -euo pipefail
          [ "$(stat -c %s "$RUNNER_TEMP/maintenance-launch-binding.json")" -le 65536 ]

      - name: Upload immutable launcher-to-child binding
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes-maintenance-launch-binding-${{ github.run_id }}
          path: ${{ runner.temp }}/maintenance-launch-binding.json
          if-no-files-found: error
          retention-days: 89

  child-admission:
    name: Admit exact maintenance child
    if: github.event_name == 'workflow_dispatch' && inputs.release_mode == 'maintenance_child'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      admitted: ${{ steps.admission.outputs.admitted }}
      launch_digest: ${{ steps.admission.outputs.launch_digest }}
      receipt_sha256: ${{ steps.admission.outputs.receipt_sha256 }}
    steps:
      - name: Verify parent, binding artifact, and child identity
        id: admission
        env:
          ACTOR: ${{ github.actor }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          INPUT_LAUNCH_DIGEST: ${{ inputs.launch_digest }}
          INPUT_LAUNCH_NONCE: ${{ inputs.launch_nonce }}
          INPUT_PARENT_RUN_ID: ${{ inputs.parent_run_id }}
          INPUT_PARENT_WORKFLOW_SHA: ${{ inputs.parent_workflow_sha }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          REF_PROTECTED: ${{ github.ref_protected }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$REPOSITORY" = "ragnos-labs/hermes-agent" ]
          [ "$REPOSITORY_VISIBILITY" = "public" ]
          [ "$EVENT_REF" = "refs/heads/main" ]
          [ "$EVENT_SHA" = "$WORKFLOW_SHA" ]
          [ "$REF_PROTECTED" = "true" ]
          [ "$WORKFLOW_RUN_ATTEMPT" = "1" ]
          [ "$WORKFLOW_REF" = "ragnos-labs/hermes-agent/.github/workflows/ghcr-execution-read-release.yml@refs/heads/main" ]
          [ "$INPUT_SOURCE_SHA" = "$MAINTENANCE_SOURCE_SHA" ]
          [ "$INPUT_SOURCE_REF" = "refs/tags/${MAINTENANCE_RELEASE_TAG}" ]
          [ "$INPUT_RELEASE_TAG" = "$MAINTENANCE_RELEASE_TAG" ]
          [[ "$INPUT_PARENT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [ "$INPUT_PARENT_WORKFLOW_SHA" = "$WORKFLOW_SHA" ]
          [[ "$INPUT_LAUNCH_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$INPUT_LAUNCH_NONCE" =~ ^[0-9a-f]{64}$ ]]
          expected_launch_digest="$(printf '%s\n' \
            "parent_run_id=${INPUT_PARENT_RUN_ID}" \
            "workflow_sha=${WORKFLOW_SHA}" \
            "source_sha=${MAINTENANCE_SOURCE_SHA}" \
            "source_tree=${MAINTENANCE_SOURCE_TREE}" \
            "release_tag=${MAINTENANCE_RELEASE_TAG}" \
            "read_schema=${MAINTENANCE_READ_SCHEMA_SHA256}" \
            "action_schema=${MAINTENANCE_ACTION_SCHEMA_SHA256}" \
            "launch_nonce=${INPUT_LAUNCH_NONCE}" \
            | sha256sum | cut -d' ' -f1)"
          [ "$INPUT_LAUNCH_DIGEST" = "$expected_launch_digest" ]

          parent_json="$RUNNER_TEMP/maintenance-parent.json"
          for poll in $(seq 1 12); do
            gh api "repos/${REPOSITORY}/actions/runs/${INPUT_PARENT_RUN_ID}" > "$parent_json"
            [ "$(jq -r '.conclusion // ""' "$parent_json")" = success ] && break
            [ "$poll" -lt 12 ] || {
              echo "::error::Launcher did not reach successful completion before child admission."
              exit 1
            }
            sleep 5
          done
          jq -e \
            --arg actor ragnos-dev \
            --arg head_sha "$WORKFLOW_SHA" \
            --arg workflow_path ".github/workflows/ghcr-execution-read-release.yml" \
            '.event == "workflow_dispatch"
             and .actor.login == $actor
             and .triggering_actor.login == $actor
             and .run_attempt == 1
             and .head_branch == "main"
             and .head_sha == $head_sha
             and (.path | startswith($workflow_path))
             and .status == "completed"
             and .conclusion == "success"' \
            "$parent_json" >/dev/null

          binding_dir="$RUNNER_TEMP/maintenance-launch-binding"
          mkdir -p "$binding_dir"
          gh run download "$INPUT_PARENT_RUN_ID" --repo "$REPOSITORY" \
            --name "hermes-maintenance-launch-binding-${INPUT_PARENT_RUN_ID}" \
            --dir "$binding_dir"
          binding="$binding_dir/maintenance-launch-binding.json"
          jq -e \
            --arg actor "$ACTOR" \
            --arg child_run_id "$WORKFLOW_RUN_ID" \
            --arg launch_digest "$INPUT_LAUNCH_DIGEST" \
            --arg launch_nonce "$INPUT_LAUNCH_NONCE" \
            --arg parent_run_id "$INPUT_PARENT_RUN_ID" \
            --arg triggering_actor "$TRIGGERING_ACTOR" \
            --arg workflow_sha "$WORKFLOW_SHA" \
            '.receipt_version == "hermes.execution.read.maintenance-launch-binding.v1"
             and .parent_run_id == $parent_run_id
             and .child_run_id == $child_run_id
             and .workflow_sha == $workflow_sha
             and .launch_digest == $launch_digest
             and .launch_nonce == $launch_nonce
             and .child_identity.actor.login == $actor
             and .child_identity.actor.type == "Bot"
             and .child_identity.triggering_actor.login == $triggering_actor
             and (.child_identity.triggering_actor.type | type == "string" and length > 0)' "$binding" >/dev/null

          current_child="$RUNNER_TEMP/maintenance-current-child.json"
          gh api "repos/${REPOSITORY}/actions/runs/${WORKFLOW_RUN_ID}" > "$current_child"
          jq -e \
            --arg actor "$ACTOR" \
            --arg triggering_actor "$TRIGGERING_ACTOR" \
            --arg head_sha "$WORKFLOW_SHA" \
            --argjson binding_actor_id "$(jq '.child_identity.actor.id' "$binding")" \
            --argjson binding_triggering_actor_id "$(jq '.child_identity.triggering_actor.id' "$binding")" \
            --arg binding_actor_type "$(jq -r '.child_identity.actor.type' "$binding")" \
            --arg binding_triggering_actor_type "$(jq -r '.child_identity.triggering_actor.type' "$binding")" \
            '.event == "workflow_dispatch"
             and .actor.type == "Bot"
             and .actor.type == $binding_actor_type
             and .triggering_actor.type == $binding_triggering_actor_type
             and .actor.login == $actor
             and .triggering_actor.login == $triggering_actor
             and .actor.id == $binding_actor_id
             and .triggering_actor.id == $binding_triggering_actor_id
             and .run_attempt == 1
             and .head_branch == "main"
             and .head_sha == $head_sha' \
            "$current_child" >/dev/null

          child_runs="$RUNNER_TEMP/maintenance-child-runs.json"
          gh api --paginate \
            "repos/${REPOSITORY}/actions/workflows/ghcr-execution-read-release.yml/runs?event=workflow_dispatch&branch=main&per_page=100" \
            > "$child_runs"
          CHILD_RUNS="$child_runs" CHILD_TITLE="hermes-maintenance-child-${INPUT_LAUNCH_DIGEST}" \
          CURRENT_RUN_ID="$WORKFLOW_RUN_ID" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          runs = []
          decoder = json.JSONDecoder()
          text = Path(os.environ["CHILD_RUNS"]).read_text(encoding="utf-8")
          index = 0
          while index < len(text):
              while index < len(text) and text[index].isspace():
                  index += 1
              if index == len(text):
                  break
              value, index = decoder.raw_decode(text, index)
              runs.extend(value.get("workflow_runs", []))
          maintenance_children = [
              run for run in runs
              if run.get("display_title", "").startswith("hermes-maintenance-child-")
          ]
          matches = [
              run for run in maintenance_children
              if run.get("display_title") == os.environ["CHILD_TITLE"]
              and run.get("event") == "workflow_dispatch"
              and run.get("actor", {}).get("type") == "Bot"
              and run.get("run_attempt") == 1
          ]
          assert len(maintenance_children) == 1, maintenance_children
          assert len(matches) == 1, matches
          assert str(matches[0]["id"]) == os.environ["CURRENT_RUN_ID"], matches[0]
          PY

          receipt="$RUNNER_TEMP/maintenance-child-admission.json"
          binding_sha256="$(sha256sum "$binding" | cut -d' ' -f1)"
          jq -n \
            --arg binding_sha256 "$binding_sha256" \
            --arg launch_digest "$INPUT_LAUNCH_DIGEST" \
            --arg run_id "$WORKFLOW_RUN_ID" \
            --arg workflow_sha "$WORKFLOW_SHA" \
            '{receipt_version:"hermes.execution.read.maintenance-child-admission.v1",
              status:"admitted",run_id:$run_id,workflow_sha:$workflow_sha,
              launch_digest:$launch_digest,binding_sha256:$binding_sha256}' > "$receipt"
          receipt_sha256="$(sha256sum "$receipt" | cut -d' ' -f1)"
          {
            echo "admitted=true"
            echo "launch_digest=$INPUT_LAUNCH_DIGEST"
            echo "receipt_sha256=$receipt_sha256"
          } >> "$GITHUB_OUTPUT"

  resolve:
    name: Resolve exact source and publication intent
    if: >-
      always()
      && (github.event_name != 'workflow_dispatch' || inputs.release_mode != 'maintenance_launcher')
      && (github.event_name != 'workflow_dispatch' || inputs.release_mode != 'maintenance_child' || needs.child-admission.result == 'success')
    needs: [child-admission]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.source.outputs.publish }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      source_ref: ${{ steps.source.outputs.source_ref }}
      release_tag: ${{ steps.source.outputs.release_tag }}
      event_ref: ${{ steps.source.outputs.event_ref }}
      workflow_ref: ${{ steps.source.outputs.workflow_ref }}
      workflow_sha: ${{ steps.source.outputs.workflow_sha }}
      workflow_run_id: ${{ steps.source.outputs.workflow_run_id }}
      workflow_run_attempt: ${{ steps.source.outputs.workflow_run_attempt }}
      maintenance: ${{ steps.source.outputs.maintenance }}
      source_tree: ${{ steps.source.outputs.source_tree }}
      schema_sha256: ${{ steps.source.outputs.schema_sha256 }}
      action_schema_sha256: ${{ steps.source.outputs.action_schema_sha256 }}
    steps:
      - name: Validate event inputs
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
          WORKFLOW_NAME: ${{ github.workflow }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_CONFIRM: ${{ inputs.confirm_publish }}
          INPUT_RELEASE_MODE: ${{ inputs.release_mode }}
          INPUT_PARENT_RUN_ID: ${{ inputs.parent_run_id }}
          INPUT_PARENT_WORKFLOW_SHA: ${{ inputs.parent_workflow_sha }}
          INPUT_LAUNCH_DIGEST: ${{ inputs.launch_digest }}
          INPUT_LAUNCH_NONCE: ${{ inputs.launch_nonce }}
          CHILD_ADMITTED: ${{ needs.child-admission.outputs.admitted }}
          CHILD_ADMISSION_LAUNCH_DIGEST: ${{ needs.child-admission.outputs.launch_digest }}
          CHILD_ADMISSION_RECEIPT_SHA256: ${{ needs.child-admission.outputs.receipt_sha256 }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          DEFAULT_SCHEMA_SHA256: ${{ env.SCHEMA_SHA256 }}
          DEFAULT_ACTION_SCHEMA_SHA256: ${{ env.ACTION_SCHEMA_SHA256 }}
        run: |
          # shellcheck disable=SC2153
          set -euo pipefail

          publish=false
          maintenance=false
          source_tree=""
          schema_sha256="$DEFAULT_SCHEMA_SHA256"
          action_schema_sha256="$DEFAULT_ACTION_SCHEMA_SHA256"
          release_tag=""
          case "$EVENT_NAME" in
            pull_request)
              source_sha="$PR_HEAD_SHA"
              source_ref="refs/pull/${PR_NUMBER}/head"
              ;;
            workflow_dispatch)
              [ "$REPOSITORY" = "ragnos-labs/hermes-agent" ] || {
                echo "::error::Publication is fork-owned and may run only in ragnos-labs/hermes-agent."
                exit 1
              }
              publish=true
              source_sha="$INPUT_SOURCE_SHA"
              source_ref="$INPUT_SOURCE_REF"
              release_tag="$INPUT_RELEASE_TAG"
              expected_workflow_ref="ragnos-labs/hermes-agent/.github/workflows/ghcr-execution-read-release.yml@refs/heads/main"
              [ "$EVENT_REF" = "refs/heads/main" ] || {
                echo "::error::Publication dispatch must run on refs/heads/main, not $EVENT_REF."
                exit 1
              }
              [ "$WORKFLOW_REF" = "$expected_workflow_ref" ] || {
                echo "::error::Dispatch used an unaudited workflow ref: $WORKFLOW_REF"
                exit 1
              }
              [ "$WORKFLOW_NAME" = "GHCR Execution Read Release" ] || {
                echo "::error::Unexpected workflow identity: $WORKFLOW_NAME"
                exit 1
              }
              [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || {
                echo "::error::github.workflow_sha is not an exact lowercase commit SHA."
                exit 1
              }
              [ "$EVENT_SHA" = "$WORKFLOW_SHA" ] || {
                echo "::error::Dispatch event SHA does not match the audited workflow SHA."
                exit 1
              }
              [ "$REF_PROTECTED" = "true" ] || {
                echo "::error::refs/heads/main is not protected by repository controls."
                exit 1
              }
              [ "$WORKFLOW_RUN_ATTEMPT" = "1" ] || {
                echo "::error::Release workflow reruns are prohibited."
                exit 1
              }
              [ "$REPOSITORY_VISIBILITY" = "public" ] || {
                echo "::error::The bounded release requires a public repository and standard included runners."
                exit 1
              }
              if [ "$INPUT_RELEASE_MODE" = "maintenance_child" ]; then
                maintenance=true
                source_tree="$MAINTENANCE_SOURCE_TREE"
                schema_sha256="$MAINTENANCE_READ_SCHEMA_SHA256"
                action_schema_sha256="$MAINTENANCE_ACTION_SCHEMA_SHA256"
                [ "$source_sha" = "$MAINTENANCE_SOURCE_SHA" ]
                [ "$source_ref" = "refs/tags/${MAINTENANCE_RELEASE_TAG}" ]
                [ "$release_tag" = "$MAINTENANCE_RELEASE_TAG" ]
                [[ "$INPUT_PARENT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
                [ "$INPUT_PARENT_WORKFLOW_SHA" = "$WORKFLOW_SHA" ]
                [[ "$INPUT_LAUNCH_DIGEST" =~ ^[0-9a-f]{64}$ ]]
                [[ "$INPUT_LAUNCH_NONCE" =~ ^[0-9a-f]{64}$ ]]
                expected_launch_digest="$(printf '%s\n' \
                  "parent_run_id=${INPUT_PARENT_RUN_ID}" \
                  "workflow_sha=${WORKFLOW_SHA}" \
                  "source_sha=${MAINTENANCE_SOURCE_SHA}" \
                  "source_tree=${MAINTENANCE_SOURCE_TREE}" \
                  "release_tag=${MAINTENANCE_RELEASE_TAG}" \
                  "read_schema=${MAINTENANCE_READ_SCHEMA_SHA256}" \
                  "action_schema=${MAINTENANCE_ACTION_SCHEMA_SHA256}" \
                  "launch_nonce=${INPUT_LAUNCH_NONCE}" \
                  | sha256sum | cut -d' ' -f1)"
                [ "$INPUT_LAUNCH_DIGEST" = "$expected_launch_digest" ]
                [ "$CHILD_ADMITTED" = "true" ]
                [ "$CHILD_ADMISSION_LAUNCH_DIGEST" = "$INPUT_LAUNCH_DIGEST" ]
                [[ "$CHILD_ADMISSION_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
              elif [ "$INPUT_RELEASE_MODE" != "ordinary" ]; then
                echo "::error::Unsupported release mode."
                exit 1
              fi
              expected_confirmation="publish ghcr.io/ragnos-labs/hermes-agent:${release_tag}"
              [ "$INPUT_CONFIRM" = "$expected_confirmation" ] || {
                echo "::error::Intent confirmation must exactly match: $expected_confirmation"
                exit 1
              }
              ;;
            *)
              echo "::error::Unsupported event: $EVENT_NAME"
              exit 1
              ;;
          esac

          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::source_sha must be an exact lowercase 40-character commit SHA."
            exit 1
          }

          if [ "$publish" = true ]; then
            [[ "$release_tag" =~ ^v[0-9]{4}\.[0-9]+\.[0-9]+(\.[0-9]+)?-ragnos\.[1-9][0-9]*$ ]] || {
              echo "::error::release_tag must use the non-colliding vYYYY.M.D[.N]-ragnos.N convention."
              exit 1
            }
            [ "$source_ref" = "refs/tags/${release_tag}" ] || {
              echo "::error::source_ref must be the exact tag ref refs/tags/${release_tag}."
              exit 1
            }
          fi

          {
            echo "publish=$publish"
            echo "source_sha=$source_sha"
            echo "source_ref=$source_ref"
            echo "release_tag=$release_tag"
            echo "event_ref=$EVENT_REF"
            echo "workflow_ref=$WORKFLOW_REF"
            echo "workflow_sha=$WORKFLOW_SHA"
            echo "workflow_run_id=$WORKFLOW_RUN_ID"
            echo "workflow_run_attempt=$WORKFLOW_RUN_ATTEMPT"
            echo "maintenance=$maintenance"
            echo "source_tree=$source_tree"
            echo "schema_sha256=$schema_sha256"
            echo "action_schema_sha256=$action_schema_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Check out audited workflow revision
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fence audited workflow revision to current main
        if: github.event_name == 'workflow_dispatch'
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          # shellcheck disable=SC2153
          set -euo pipefail
          git fetch --force --no-tags origin refs/heads/main
          [ "$(git rev-parse 'HEAD^{commit}')" = "$WORKFLOW_SHA" ]
          [ "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$WORKFLOW_SHA" ] || {
            echo "::error::main moved after dispatch; audited workflow revision is stale."
            exit 1
          }
          [ "$WORKFLOW_REF" = "ragnos-labs/hermes-agent/.github/workflows/ghcr-execution-read-release.yml@refs/heads/main" ]
          git ls-tree -r --name-only "$WORKFLOW_SHA" -- \
            .github/workflows/ghcr-execution-read-release.yml \
            | grep -Fxq .github/workflows/ghcr-execution-read-release.yml

  publication-policy:
    name: Publication state-transition guards
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out workflow under policy test
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && needs.resolve.outputs.workflow_sha || github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up ORAS under publication policy
        uses: oras-project/setup-oras@0d9191fa0dd41eaefe9e28b375a02290706ce51d # upstream-main-2026-08-06
        with:
          version: ${{ env.ORAS_VERSION }}

      - name: Test ORAS setup and release-step parity
        env:
          WORKFLOW_PATH: .github/workflows/ghcr-execution-read-release.yml
        run: |
          set -euo pipefail
          version_output="$(oras version)"
          version_lines=()
          while IFS= read -r line; do
            case "$line" in
              Version:*) version_lines+=("$line") ;;
            esac
          done <<< "$version_output"
          [ "${#version_lines[@]}" -eq 1 ] || {
            echo "::error::oras version returned ${#version_lines[@]} Version: lines; expected exactly one."
            exit 1
          }
          actual_version="${version_lines[0]#Version:}"
          actual_version="${actual_version#"${actual_version%%[![:space:]]*}"}"
          actual_version="${actual_version%"${actual_version##*[![:space:]]}"}"
          [ "$actual_version" = "$ORAS_VERSION" ] || {
            echo "::error::setup-oras installed ${actual_version:-no version}; expected ${ORAS_VERSION}."
            exit 1
          }
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          text = Path(os.environ["WORKFLOW_PATH"]).read_text(encoding="utf-8")


          def job_body(name):
              job = re.compile(
                  rf"(?ms)^  {re.escape(name)}:\n(.*?)(?=^  [a-zA-Z0-9_-]+:\n|\Z)"
              ).findall(text)
              assert len(job) == 1, f"expected exactly one {name} job"
              return job[0]


          setup_contract = re.compile(
              r"(?m)^\s+uses: oras-project/setup-oras@([0-9a-f]{40})\s+#\s+\S+\s*$\n"
              r"^\s+with:\s*$\n"
              r"^\s+version:\s+(\$\{\{\s*env\.ORAS_VERSION\s*\}\})\s*$"
          )
          setup_contracts = {}
          for job_name in ("publication-policy", "manifest"):
              matches = setup_contract.findall(job_body(job_name))
              assert len(matches) == 1, (
                  f"{job_name} must contain exactly one immutable setup-oras contract"
              )
              setup_contracts[job_name] = matches[0]
          assert setup_contracts["publication-policy"] == setup_contracts["manifest"], (
              "publication-policy and manifest must use the same setup-oras SHA "
              "and shared ORAS version expression"
          )
          print("oras_setup_and_release_parity=passed")
          PY

      - name: Test audited workflow dispatch fence
        run: |
          python3 - <<'PY'
          EXPECTED_WORKFLOW_REF = (
              "ragnos-labs/hermes-agent/.github/workflows/"
              "ghcr-execution-read-release.yml@refs/heads/main"
          )
          SHA = "a" * 40


          def accepted(*, repository, event_ref, workflow_ref, event_sha, workflow_sha, protected, source_ancestor):
              return (
                  repository == "ragnos-labs/hermes-agent"
                  and event_ref == "refs/heads/main"
                  and workflow_ref == EXPECTED_WORKFLOW_REF
                  and event_sha == workflow_sha
                  and len(workflow_sha) == 40
                  and all(character in "0123456789abcdef" for character in workflow_sha)
                  and protected
                  and source_ancestor
              )


          valid = dict(
              repository="ragnos-labs/hermes-agent",
              event_ref="refs/heads/main",
              workflow_ref=EXPECTED_WORKFLOW_REF,
              event_sha=SHA,
              workflow_sha=SHA,
              protected=True,
              source_ancestor=True,
          )
          assert accepted(**valid)
          for field, unsafe in (
              ("repository", "NousResearch/hermes-agent"),
              ("event_ref", "refs/heads/copied-workflow"),
              ("event_ref", "refs/tags/v2026.8.15"),
              ("workflow_ref", EXPECTED_WORKFLOW_REF.replace("main", "copied-workflow")),
              ("event_sha", "b" * 40),
              ("workflow_sha", "not-an-exact-sha"),
              ("protected", False),
              ("source_ancestor", False),
          ):
              candidate = valid | {field: unsafe}
              assert not accepted(**candidate), (field, unsafe)
          print("audited_workflow_dispatch_fence=passed")
          PY

      - name: Test external environment authorization policy
        run: |
          python3 - <<'PY'
          RELEASE_ENVIRONMENT = "hermes-execution-read-release"
          RELEASE_OPERATOR = "ragnos-dev"


          def accepted(*, maintenance, environment_name, reviewers, prevent_self_review, can_admins_bypass, policy, custom_names=()):
              dedicated_environment = environment_name == RELEASE_ENVIRONMENT
              operator_review = (
                  reviewers == [{"type": "User", "login": RELEASE_OPERATOR}]
                  and prevent_self_review is maintenance
              )
              no_admin_bypass = can_admins_bypass is False
              main_only = (
                  policy == "protected_branches"
                  or (policy == "custom_branch_policies" and "main" in custom_names)
              )
              return dedicated_environment and operator_review and no_admin_bypass and main_only


          protected = dict(
              maintenance=True,
              environment_name=RELEASE_ENVIRONMENT,
              reviewers=[{"type": "User", "login": RELEASE_OPERATOR}],
              prevent_self_review=True,
              can_admins_bypass=False,
              policy="protected_branches",
          )
          custom_main = protected | {
              "policy": "custom_branch_policies",
              "custom_names": ["main"],
          }
          assert accepted(**protected)
          assert accepted(**custom_main)
          assert accepted(**(protected | {"maintenance": False, "prevent_self_review": False}))
          assert not accepted(**(protected | {"can_admins_bypass": True}))
          assert not accepted(**(protected | {"reviewers": []}))
          assert not accepted(**(protected | {"reviewers": [{"type": "User", "login": "independent-maintainer"}]}))
          assert not accepted(**(protected | {"reviewers": protected["reviewers"] + [{"type": "User", "login": "backup-operator"}]}))
          assert not accepted(**(protected | {"reviewers": protected["reviewers"] + [{"type": "Team", "login": "release-operators"}]}))
          assert not accepted(**(protected | {"maintenance": True, "prevent_self_review": False}))
          assert not accepted(**(protected | {"maintenance": False, "prevent_self_review": True}))
          assert not accepted(**(protected | {"policy": None}))
          assert not accepted(**(protected | {"environment_name": "gh-image"}))
          assert not accepted(**(custom_main | {"custom_names": ["release-copy"]}))
          print("external_environment_authorization_policy=passed")
          PY

      - name: Test fail-closed registry inspection and ambiguous delivery recovery
        run: |
          python3 - <<'PY'
          from scripts.ci.classify_ghcr_release_absence import is_explicit_absence


          def classify_attempt(returncode, stderr, raw_valid=False, digest_valid=False):
              if returncode == 0:
                  return "present" if raw_valid and digest_valid else "unknown"
              return "absent" if is_explicit_absence(stderr) else "unknown"


          assert classify_attempt(0, "", True, True) == "present"
          assert classify_attempt(0, "", False, True) == "unknown"
          assert classify_attempt(1, "MANIFEST_UNKNOWN: manifest unknown") == "absent"
          assert classify_attempt(
              1, "ghcr.io/ragnos-labs/hermes-agent:v2026.8.19-ragnos.1: not found"
          ) == "absent"
          assert classify_attempt(
              1, "unexpected status from HEAD request to "
              "https://ghcr.io/v2/ragnos-labs/hermes-agent/manifests/"
              "v2026.8.19.2-ragnos.3: 404 Not Found"
          ) == "absent"
          malformed = (
              "ghcr.io/ragnos-labs/hermes-agent:v2026.8.19: not found",
              "ghcr.io/ragnos-labs/hermes-agent:v2026.8-ragnos.1: not found",
              "ghcr.io/ragnos-labs/hermes-agent:v2026.8.19-ragnos.0: not found",
              "ghcr.io/ragnos-labs/hermes-agent:v2026.8.19-ragnos.1-extra: not found",
              "ghcr.io/another-owner/hermes-agent:v2026.8.19-ragnos.1: not found",
          )
          for error in malformed:
              assert classify_attempt(1, error) == "unknown", error
          absence = "ghcr.io/ragnos-labs/hermes-agent:v2026.8.19-ragnos.1: not found"
          for error in (
              "unauthorized: authentication required",
              "context deadline exceeded",
              "TLS handshake timeout",
              "unexpected EOF",
              "malformed registry response",
          ):
              assert classify_attempt(1, error) == "unknown", error
              assert classify_attempt(1, f"{absence}\n{error}") == "unknown", error

          def bounded_result(attempts):
              if "present" in attempts:
                  return "present"
              if len(attempts) == 3 and set(attempts) == {"absent"}:
                  return "absent"
              return "unknown"


          assert bounded_result(["absent", "absent", "absent"]) == "absent"
          assert bounded_result(["unknown", "absent", "absent"]) == "unknown"
          assert bounded_result(["timeout", "unknown", "present"]) == "present"

          def unchanged(expected_state, expected_digest, observed_state, observed_digest):
              if observed_state == "unknown":
                  return False
              if expected_state == "absent":
                  return observed_state == "absent"
              return observed_state == "present" and observed_digest == expected_digest


          digest = "sha256:" + "a" * 64
          assert unchanged("absent", "", "absent", "")
          assert unchanged("matching", digest, "present", digest)
          assert not unchanged("absent", "", "unknown", "")
          assert not unchanged("matching", digest, "unknown", "")
          assert not unchanged("matching", digest, "present", "sha256:" + "b" * 64)

          def reconcile(create_result, reinspections):
              if create_result == "success":
                  return "delivered"
              final = reinspections[-1]
              if final == "present_matching":
                  return "delivered_after_transport_error"
              if create_result == "timeout" or final == "timeout":
                  return "timed_out_unknown"
              if final == "absent":
                  return "delivery_failed_confirmed_absent"
              return "delivery_unknown"


          assert reconcile("error", ["unknown", "present_matching"]) == "delivered_after_transport_error"
          assert reconcile("error", ["absent", "absent", "absent"]) == "delivery_failed_confirmed_absent"
          assert reconcile("error", ["unknown", "unknown", "unknown"]) == "delivery_unknown"
          assert reconcile("timeout", ["unknown", "timeout", "unknown"]) == "timed_out_unknown"
          print("registry_inspection_and_delivery_recovery=passed")
          PY

      - name: Test action receipt release-tag compatibility
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          schema_bytes = Path(os.environ["ACTION_SCHEMA_PATH"]).read_bytes()
          assert hashlib.sha256(schema_bytes).hexdigest() == os.environ["ACTION_SCHEMA_SHA256"]
          schema = json.loads(schema_bytes)
          pattern = schema["$defs"]["releaseReceipt"]["properties"]["release_tag"]["pattern"]
          for release_tag in (
              "v2026.8.19",
              "v2026.8.19.2",
              "v2026.8.19-ragnos.1",
              "v2026.8.19.2-ragnos.3",
          ):
              assert re.fullmatch(pattern, release_tag), release_tag
          for release_tag in (
              "v2026.8",
              "v2026.8.19-ragnos.0",
              "v2026.8.19-ragnos.01",
              "v2026.8.19-ragnos",
              "v2026.8.19-ragnos.1-extra",
              "v2026.8.19-other.1",
          ):
              assert re.fullmatch(pattern, release_tag) is None, release_tag
          print("action_receipt_release_tag_compatibility=passed")
          PY

      - name: Test fail-closed tag and recovery transitions
        run: |
          python3 - <<'PY'
          import json


          class Rejected(Exception):
              pass


          def plan(*, children, tag_still_exact, sha_state, release_state, same_digest=True):
              actions = []
              if set(children) != {"amd64", "arm64"}:
                  raise Rejected("both architecture proofs are required before any tag mutation")
              if not tag_still_exact:
                  raise Rejected("the CalVer source tag moved")
              if release_state == "conflict":
                  raise Rejected("release tag conflicts; reject before creating the SHA tag")
              if sha_state == "conflict":
                  raise Rejected("immutable SHA tag conflicts")
              if sha_state == release_state == "matching" and not same_digest:
                  raise Rejected("matching-content tags must resolve to the same index digest")
              if release_state == "matching" and sha_state == "absent":
                  actions.append("create_sha_from_release")
              elif sha_state == "absent":
                  actions.append("create_sha_from_children")
              if release_state == "absent":
                  actions.append("create_release_from_sha")
              return actions


          cases = {
              "one_arch_failure": lambda: plan(
                  children={"amd64"}, tag_still_exact=True,
                  sha_state="absent", release_state="absent"
              ),
              "duplicate_rerun": lambda: plan(
                  children={"amd64", "arm64"}, tag_still_exact=True,
                  sha_state="matching", release_state="matching"
              ),
              "moved_tag": lambda: plan(
                  children={"amd64", "arm64"}, tag_still_exact=False,
                  sha_state="absent", release_state="absent"
              ),
              "existing_matching_tags": lambda: plan(
                  children={"amd64", "arm64"}, tag_still_exact=True,
                  sha_state="matching", release_state="matching", same_digest=True
              ),
              "conflicting_release_tag": lambda: plan(
                  children={"amd64", "arm64"}, tag_still_exact=True,
                  sha_state="absent", release_state="conflict"
              ),
              "recovery_from_sha_tag": lambda: plan(
                  children={"amd64", "arm64"}, tag_still_exact=True,
                  sha_state="matching", release_state="absent"
              ),
              "recovery_from_release_tag": lambda: plan(
                  children={"amd64", "arm64"}, tag_still_exact=True,
                  sha_state="absent", release_state="matching"
              ),
          }
          rejected = {"one_arch_failure", "moved_tag", "conflicting_release_tag"}
          results = {}
          for name, case in cases.items():
              try:
                  results[name] = {"outcome": "accepted", "actions": case()}
              except Rejected as exc:
                  results[name] = {"outcome": "rejected", "reason": str(exc)}

          assert all(results[name]["outcome"] == "rejected" for name in rejected), results
          assert results["duplicate_rerun"]["actions"] == [], results
          assert results["existing_matching_tags"]["actions"] == [], results
          assert results["recovery_from_sha_tag"]["actions"] == ["create_release_from_sha"], results
          assert results["recovery_from_release_tag"]["actions"] == ["create_sha_from_release"], results
          print(json.dumps(results, indent=2, sort_keys=True))
          PY

      - name: Test publication graph, global lock, and exact-digest copy fences
        env:
          WORKFLOW_PATH: .github/workflows/ghcr-execution-read-release.yml
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          text = Path(os.environ["WORKFLOW_PATH"]).read_text(encoding="utf-8")


          def job_body(name):
              matches = re.compile(
                  rf"(?ms)^  {re.escape(name)}:\n(.*?)(?=^  [a-zA-Z0-9_-]+:\n|\Z)"
              ).findall(text)
              assert len(matches) == 1, name
              return matches[0]


          registry_preflight = job_body("registry-preflight")
          manifest = job_body("manifest")
          assert "'ghcr-execution-read-publication'" in text
          assert text.index("\n  registry-preflight:\n") < text.index("\n  publish:\n") < text.index("\n  manifest:\n")
          assert "needs: [resolve, authorize, registry-preflight]" in text
          assert "needs.registry-preflight.outputs.rebuild == 'true'" in text
          assert "name: ghcr-execution-read-proof-" in text
          assert "name: ghcr-execution-read-preflight-" in text
          assert text.count("github.run_attempt") >= 5
          assert '"${IMAGE_NAME}@${release_preflight_digest}"' in text
          assert '"${IMAGE_NAME}@${sha_digest}"' in text
          mutable_sha_copy = 'docker buildx imagetools create --tag "$sha_ref" ' + '"$release_ref"'
          mutable_release_copy = 'docker buildx imagetools create --tag "$release_ref" ' + '"$sha_ref"'
          assert mutable_sha_copy not in text
          assert mutable_release_copy not in text
          assert 'git merge-base --is-ancestor "$SOURCE_SHA" "$WORKFLOW_SHA"' in text
          for runtime_job in (registry_preflight, manifest):
              assert runtime_job.count("name: Materialize audited registry policy outside the source checkout") == 1
              assert runtime_job.count('classifier_spec="${WORKFLOW_SHA}:scripts/ci/classify_ghcr_release_absence.py"') == 1
              assert runtime_job.count('git show "$classifier_spec" > "$classifier_path"') == 1
              assert 'python3 scripts/ci/classify_ghcr_release_absence.py' not in runtime_job
          assert registry_preflight.count('python3 "$AUDITED_GHCR_ABSENCE_CLASSIFIER" "$1"') == 1
          assert manifest.count('python3 "$AUDITED_GHCR_ABSENCE_CLASSIFIER" "$error_path"') == 1
          assert '"${IMAGE_NAME}@${final_release_digest}" --raw' in text
          assert "application/vnd.ragnos.hermes.execution.read.release-receipt.v1+json" in text
          assert "ACTION_CONTRACT_VERSION: hermes.execution.action.v1" in text
          assert "ACTION_SCHEMA_PATH: hermes_cli/execution_contract_schemas/hermes.execution.action.v1.schema.json" in text
          assert "ACTION_SCHEMA_SHA256: bcbc0d307b9c605a722c6ea805ef27741a35c4c75d07c32c645d0507c3bf9e9b" in text
          assert text.count("io.ragnos.hermes.execution.action-contract") >= 8
          assert text.count("io.ragnos.hermes.execution.action-schema-sha256") >= 8
          assert text.count("io.ragnos.hermes.execution.action-source-sha") >= 8
          assert "index:io.ragnos.hermes.execution.action-contract=${ACTION_CONTRACT_VERSION}" in text
          assert "application/vnd.ragnos.hermes.execution.action.release-receipt.v1+json" in text
          assert "hermes.execution.action.release-receipt.v1" in text
          print("publication_graph_and_exact_digest_fences=passed")
          PY

  conformance:
    name: Execution-read conformance and package proof
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SCHEMA_SHA256: ${{ needs.resolve.outputs.schema_sha256 }}
      ACTION_SCHEMA_SHA256: ${{ needs.resolve.outputs.action_schema_sha256 }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove source ref, commit, tree, contract, and schema
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          RELEASE_SOURCE_REF: ${{ needs.resolve.outputs.source_ref }}
          SOURCE_TREE: ${{ needs.resolve.outputs.source_tree }}
          MAINTENANCE: ${{ needs.resolve.outputs.maintenance }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse 'HEAD^{commit}')"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          if [ "$MAINTENANCE" != true ]; then
            git fetch --force --no-tags origin "$RELEASE_SOURCE_REF"
            resolved_sha="$(git rev-parse 'FETCH_HEAD^{commit}')"
            [ "$resolved_sha" = "$SOURCE_SHA" ] || {
              echo "::error::Source ref moved: $RELEASE_SOURCE_REF resolves to $resolved_sha, expected $SOURCE_SHA."
              exit 1
            }
          fi
          [ "$checked_out_sha" = "$SOURCE_SHA" ] || {
            echo "::error::Checkout mismatch: got $checked_out_sha, expected $SOURCE_SHA."
            exit 1
          }
          if [ -n "$SOURCE_TREE" ]; then
            [ "$source_tree" = "$SOURCE_TREE" ] || {
              echo "::error::Source tree mismatch: got $source_tree, expected $SOURCE_TREE."
              exit 1
            }
          fi
          printf '%s  %s\n' "$SCHEMA_SHA256" "$SCHEMA_PATH" | sha256sum -c -
          printf '%s  %s\n' "$ACTION_SCHEMA_SHA256" "$ACTION_SCHEMA_PATH" | sha256sum -c -
          python3 - <<'PY'
          from hermes_cli.execution_contract import (
              ACTION_CONTRACT_VERSION,
              CONTRACT_VERSION,
              action_contract_schema,
          )
          assert CONTRACT_VERSION == "hermes.execution.read.v1", CONTRACT_VERSION
          assert ACTION_CONTRACT_VERSION == "hermes.execution.action.v1", ACTION_CONTRACT_VERSION
          assert action_contract_schema()["$id"].endswith(
              "hermes.execution.action.v1.schema.json"
          )
          PY
          {
            echo "### Exact source proof"
            echo "- ref: \`$RELEASE_SOURCE_REF\`"
            echo "- commit: \`$SOURCE_SHA\`"
            echo "- tree: \`$source_tree\`"
            echo "- contract: \`$CONTRACT_VERSION\`"
            echo "- schema SHA-256: \`$SCHEMA_SHA256\`"
            echo "- action contract: \`$ACTION_CONTRACT_VERSION\`"
            echo "- action schema SHA-256: \`$ACTION_SCHEMA_SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.9.28"

      - name: Set up Python 3.11
        uses: ./.github/actions/retry
        with:
          command: uv python install 3.11

      - name: Install conformance dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra dev --extra messaging

      - name: Run execution read/action contract and API conformance
        run: |
          scripts/run_tests.sh \
            tests/hermes_cli/test_execution_contract.py \
            tests/gateway/test_api_server_execution_contract.py

  build:
    name: Container proof (${{ matrix.arch }})
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
            cache-from: type=gha,scope=ghcr-execution-read-amd64
            cache-to: type=gha,mode=max,scope=ghcr-execution-read-amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            cache-from: type=gha,scope=ghcr-execution-read-arm64
            cache-to: type=gha,mode=max,scope=ghcr-execution-read-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    permissions:
      contents: read
    env:
      SCHEMA_SHA256: ${{ needs.resolve.outputs.schema_sha256 }}
      ACTION_SCHEMA_SHA256: ${{ needs.resolve.outputs.action_schema_sha256 }}
    steps:
      - name: Verify exact native build runner
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          RUNNER_ARCH: ${{ runner.arch }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          [ "$RUNNER_OS" = "Linux" ]
          case "$EXPECTED_ARCH" in
            amd64) [ "$RUNNER_ARCH" = "X64" ] ;;
            arm64) [ "$RUNNER_ARCH" = "ARM64" ] ;;
            *) exit 1 ;;
          esac

      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove source and schema before build
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          RELEASE_SOURCE_REF: ${{ needs.resolve.outputs.source_ref }}
          SOURCE_TREE: ${{ needs.resolve.outputs.source_tree }}
          MAINTENANCE: ${{ needs.resolve.outputs.maintenance }}
        run: |
          set -euo pipefail
          if [ "$MAINTENANCE" != true ]; then
            git fetch --force --no-tags origin "$RELEASE_SOURCE_REF"
            [ "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$SOURCE_SHA" ]
          fi
          [ "$(git rev-parse 'HEAD^{commit}')" = "$SOURCE_SHA" ]
          if [ -n "$SOURCE_TREE" ]; then
            [ "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE" ]
          fi
          printf '%s  %s\n' "$SCHEMA_SHA256" "$SCHEMA_PATH" | sha256sum -c -
          printf '%s  %s\n' "$ACTION_SCHEMA_SHA256" "$ACTION_SCHEMA_PATH" | sha256sum -c -

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build native image without publishing
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          provenance: false
          platforms: ${{ matrix.platform }}
          tags: local/hermes-execution-read:${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/ragnos-labs/hermes-agent
            org.opencontainers.image.revision=${{ needs.resolve.outputs.source_sha }}
            io.ragnos.hermes.execution.contract=${{ env.CONTRACT_VERSION }}
            io.ragnos.hermes.execution.schema-sha256=${{ env.SCHEMA_SHA256 }}
            io.ragnos.hermes.execution.action-contract=${{ env.ACTION_CONTRACT_VERSION }}
            io.ragnos.hermes.execution.action-schema-sha256=${{ env.ACTION_SCHEMA_SHA256 }}
            io.ragnos.hermes.execution.action-source-sha=${{ needs.resolve.outputs.source_sha }}
          build-args: |
            HERMES_GIT_SHA=${{ needs.resolve.outputs.source_sha }}
          cache-from: ${{ matrix.cache-from }}
          cache-to: ${{ github.event_name != 'pull_request' && needs.resolve.outputs.maintenance != 'true' && matrix.cache-to || '' }}

      - name: Prove native image revision and packaged contract
        env:
          ARCH: ${{ matrix.arch }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: |
          set -euo pipefail
          image="local/hermes-execution-read:${ARCH}"
          revision="$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          contract="$(docker image inspect "$image" --format '{{ index .Config.Labels "io.ragnos.hermes.execution.contract" }}')"
          schema_digest="$(docker image inspect "$image" --format '{{ index .Config.Labels "io.ragnos.hermes.execution.schema-sha256" }}')"
          action_contract="$(docker image inspect "$image" --format '{{ index .Config.Labels "io.ragnos.hermes.execution.action-contract" }}')"
          action_schema_digest="$(docker image inspect "$image" --format '{{ index .Config.Labels "io.ragnos.hermes.execution.action-schema-sha256" }}')"
          action_source_sha="$(docker image inspect "$image" --format '{{ index .Config.Labels "io.ragnos.hermes.execution.action-source-sha" }}')"
          [ "$revision" = "$SOURCE_SHA" ]
          [ "$contract" = "$CONTRACT_VERSION" ]
          [ "$schema_digest" = "$SCHEMA_SHA256" ]
          [ "$action_contract" = "$ACTION_CONTRACT_VERSION" ]
          [ "$action_schema_digest" = "$ACTION_SCHEMA_SHA256" ]
          [ "$action_source_sha" = "$SOURCE_SHA" ]
          docker run --rm -i \
            -e EXPECTED_SOURCE_SHA="$SOURCE_SHA" \
            -e ACTION_SCHEMA_SHA256="$ACTION_SCHEMA_SHA256" \
            --entrypoint /opt/hermes/.venv/bin/python "$image" - <<'PY'
          import hashlib
          import os
          from importlib.resources import files
          from pathlib import Path

          from hermes_cli.execution_contract import (
              ACTION_CONTRACT_VERSION,
              CONTRACT_VERSION,
              action_contract_schema,
              contract_schema,
          )

          expected_sha = "7b2c4569d52a048c31a5a42861817b748e5742ce6cac6eafba1d41dc090340c3"
          expected_action_sha = os.environ["ACTION_SCHEMA_SHA256"]
          expected_source = Path("/opt/hermes/.hermes_build_sha").read_text().strip()
          schema_path = files("hermes_cli").joinpath(
              "execution_contract_schemas/hermes.execution.read.v1.schema.json"
          )
          actual_sha = hashlib.sha256(schema_path.read_bytes()).hexdigest()
          action_schema_path = files("hermes_cli").joinpath(
              "execution_contract_schemas/hermes.execution.action.v1.schema.json"
          )
          actual_action_sha = hashlib.sha256(action_schema_path.read_bytes()).hexdigest()
          assert expected_source == os.environ["EXPECTED_SOURCE_SHA"], expected_source
          assert CONTRACT_VERSION == "hermes.execution.read.v1", CONTRACT_VERSION
          assert contract_schema()["$id"].endswith("hermes.execution.read.v1.schema.json")
          assert actual_sha == expected_sha, actual_sha
          assert ACTION_CONTRACT_VERSION == "hermes.execution.action.v1"
          assert action_contract_schema()["$id"].endswith(
              "hermes.execution.action.v1.schema.json"
          )
          assert actual_action_sha == expected_action_sha, actual_action_sha
          print(f"source_sha={expected_source}")
          print(f"contract={CONTRACT_VERSION}")
          print(f"packaged_schema_sha256={actual_sha}")
          print(f"action_contract={ACTION_CONTRACT_VERSION}")
          print(f"packaged_action_schema_sha256={actual_action_sha}")
          PY

  authorize:
    name: Verify external release gates
    if: needs.resolve.outputs.publish == 'true' && github.repository == 'ragnos-labs/hermes-agent'
    needs: [resolve, publication-policy, conformance, build]
    environment: hermes-execution-read-release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      approval_digest: ${{ steps.approval.outputs.approval_digest }}
    steps:
      - name: Require protected release approval and main-only deployment
        id: approval
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ENVIRONMENT: hermes-execution-read-release
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          SOURCE_TREE: ${{ needs.resolve.outputs.source_tree }}
          MAINTENANCE: ${{ needs.resolve.outputs.maintenance }}
          WORKFLOW_SHA: ${{ needs.resolve.outputs.workflow_sha }}
        run: |
          set -euo pipefail
          authorization_receipt="$RUNNER_TEMP/authorization-receipt.json"
          record_authorization_failure() {
            AUTHORIZATION_RECEIPT="$authorization_receipt" \
            FAILURE_STATUS="$1" \
            SOURCE_SHA="$SOURCE_SHA" \
            WORKFLOW_SHA="$WORKFLOW_SHA" \
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          Path(os.environ["AUTHORIZATION_RECEIPT"]).write_text(json.dumps({
              "receipt_version": "hermes.execution.read.authorization-receipt.v1",
              "status": os.environ["FAILURE_STATUS"],
              "source_sha": os.environ["SOURCE_SHA"],
              "workflow_sha": os.environ["WORKFLOW_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          }
          current_main="$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [ "$current_main" = "$WORKFLOW_SHA" ] || {
            record_authorization_failure "workflow_revision_stale"
            echo "::error::main moved after the audited workflow revision; dispatch is stale."
            exit 1
          }
          if [ "$MAINTENANCE" = true ]; then
            [ "$SOURCE_SHA" = "$MAINTENANCE_SOURCE_SHA" ]
            [ "$SOURCE_TREE" = "$MAINTENANCE_SOURCE_TREE" ]
          else
            comparison_status="$(gh api "repos/${REPOSITORY}/compare/${SOURCE_SHA}...${WORKFLOW_SHA}" --jq '.status')" || {
              record_authorization_failure "source_ancestry_unavailable"
              echo "::error::Could not prove source ancestry against the audited workflow revision."
              exit 1
            }
            [[ "$comparison_status" =~ ^(ahead|identical)$ ]] || {
              record_authorization_failure "source_not_ancestor_of_workflow"
              echo "::error::SOURCE_SHA is not an ancestor of WORKFLOW_SHA/current main."
              exit 1
            }
          fi
          environment_json="$RUNNER_TEMP/release-environment.json"
          gh api "repos/${REPOSITORY}/environments/${RELEASE_ENVIRONMENT}" > "$environment_json"
          MAINTENANCE="$MAINTENANCE" python3 - "$environment_json" <<'PY'
          import json
          import os
          import sys

          environment = json.load(open(sys.argv[1], encoding="utf-8"))
          release_environment = os.environ["RELEASE_ENVIRONMENT"]
          release_operator = "ragnos-dev"
          maintenance = os.environ["MAINTENANCE"] == "true"
          assert environment.get("name") == release_environment, (
              "GitHub returned the wrong release environment"
          )
          reviewer_rules = [
              rule for rule in environment.get("protection_rules", [])
              if rule.get("type") == "required_reviewers"
          ]
          reviewers = reviewer_rules[0].get("reviewers", []) if len(reviewer_rules) == 1 else []
          policy = environment.get("deployment_branch_policy") or {}
          assert (
              len(reviewers) == 1
              and reviewers[0].get("type") == "User"
              and reviewers[0].get("reviewer", {}).get("login") == release_operator
              and reviewer_rules[0].get("prevent_self_review") is maintenance
          ), (
              f"{release_environment} must require Hunter's ragnos-dev account "
              f"with self-review prevention {'enabled' if maintenance else 'disabled'}"
          )
          assert environment.get("can_admins_bypass") is False, (
              f"{release_environment} must disable administrator protection-rule bypass"
          )
          assert policy.get("protected_branches") or policy.get("custom_branch_policies"), (
              f"{release_environment} must restrict deployments to protected branches or custom main policy"
          )
          print(json.dumps({"required_reviewer_rules": len(reviewer_rules), "deployment_branch_policy": policy}))
          PY

          custom_policies="$(jq -r '.deployment_branch_policy.custom_branch_policies // false' "$environment_json")"
          if [ "$custom_policies" = "true" ]; then
            gh api --paginate \
              "repos/${REPOSITORY}/environments/${RELEASE_ENVIRONMENT}/deployment-branch-policies" \
              --jq '.branch_policies[]?.name' \
              | grep -Fxq main || {
              echo "::error::${RELEASE_ENVIRONMENT} custom deployment policies do not include exact branch main."
              exit 1
            }
          fi

          if [ "$MAINTENANCE" = true ]; then
            approvals="$RUNNER_TEMP/release-approvals.json"
            gh api "repos/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/approvals" > "$approvals"
            approval_digest="$(APPROVALS="$approvals" python3 - <<'PY'
          import json
          import os
          import re

          approvals = json.load(open(os.environ["APPROVALS"], encoding="utf-8"))
          expected = []
          for approval in approvals:
              environments = approval.get("environments", [])
              if (
                  approval.get("state") == "approved"
                  and approval.get("user", {}).get("login") == "ragnos-dev"
                  and approval.get("user", {}).get("id") == 214172043
                  and len(environments) == 1
                  and environments[0].get("id") == 19967279515
                  and environments[0].get("name") == "hermes-execution-read-release"
              ):
                  match = re.fullmatch(
                      r"approve hermes-maintenance-gates sha256:([0-9a-f]{64})",
                      approval.get("comment") or "",
                  )
                  if match:
                      expected.append(match.group(1))
          assert len(expected) == 1, expected
          print(expected[0])
          PY
            )"
            [[ "$approval_digest" =~ ^[0-9a-f]{64}$ ]]
            APPROVAL_DIGEST="$approval_digest" AUTHORIZATION_RECEIPT="$authorization_receipt" \
            SOURCE_SHA="$SOURCE_SHA" WORKFLOW_SHA="$WORKFLOW_SHA" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          Path(os.environ["AUTHORIZATION_RECEIPT"]).write_text(json.dumps({
              "receipt_version": "hermes.execution.read.authorization-receipt.v1",
              "status": "approved",
              "environment": {"id": 19967279515, "name": "hermes-execution-read-release"},
              "reviewer": {"id": 214172043, "login": "ragnos-dev"},
              "gate_packet_sha256": os.environ["APPROVAL_DIGEST"],
              "source_sha": os.environ["SOURCE_SHA"],
              "workflow_sha": os.environ["WORKFLOW_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
            echo "approval_digest=$approval_digest" >> "$GITHUB_OUTPUT"
          fi

          echo "External hold passed: ${RELEASE_ENVIRONMENT} operator approval and main deployment restriction are present."
          echo "CalVer tag protection and GHCR package-writer restriction remain pilot-owned external gates."

      - name: Enforce authorization artifact cap
        if: always()
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/authorization-receipt.json"
          [ ! -e "$candidate" ] || [ "$(stat -c %s "$candidate")" -le 262144 ]

      - name: Upload authorization failure receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghcr-execution-read-authorization-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/authorization-receipt.json
          if-no-files-found: ignore
          retention-days: 89

  release-lock:
    name: Create exact maintenance release lock
    if: needs.resolve.outputs.publish == 'true' && needs.resolve.outputs.maintenance == 'true' && github.repository == 'ragnos-labs/hermes-agent'
    needs: [resolve, authorize]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      packages: read
    outputs:
      tag_sha: ${{ steps.lock.outputs.tag_sha }}
      receipt_sha256: ${{ steps.lock.outputs.receipt_sha256 }}
    steps:
      - name: Re-prove collision, ACL, ruleset, and create the tag once
        id: lock
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          SOURCE_TREE: ${{ needs.resolve.outputs.source_tree }}
          WORKFLOW_RUN_ATTEMPT: ${{ needs.resolve.outputs.workflow_run_attempt }}
          WORKFLOW_RUN_ID: ${{ needs.resolve.outputs.workflow_run_id }}
          WORKFLOW_SHA: ${{ needs.resolve.outputs.workflow_sha }}
          MAINTENANCE: ${{ needs.resolve.outputs.maintenance }}
          APPROVAL_DIGEST: ${{ needs.authorize.outputs.approval_digest }}
        run: |
          set -euo pipefail
          [ "$SOURCE_SHA" = "$MAINTENANCE_SOURCE_SHA" ]
          [ "$SOURCE_TREE" = "$MAINTENANCE_SOURCE_TREE" ]
          [ "$RELEASE_TAG" = "$MAINTENANCE_RELEASE_TAG" ]
          [ "$WORKFLOW_RUN_ATTEMPT" = "1" ]
          [[ "$APPROVAL_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [ "$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$WORKFLOW_SHA" ]

          package_json="$RUNNER_TEMP/maintenance-package.json"
          active_versions="$RUNNER_TEMP/maintenance-active-versions.json"
          deleted_versions="$RUNNER_TEMP/maintenance-deleted-versions.json"
          rulesets="$RUNNER_TEMP/maintenance-rulesets.json"
          tag_probe="$RUNNER_TEMP/maintenance-tag-probe.json"
          tag_create="$RUNNER_TEMP/maintenance-tag-create.json"
          receipt="$RUNNER_TEMP/maintenance-release-lock.json"

          gh api "orgs/ragnos-labs/packages/container/hermes-agent" > "$package_json"
          jq -e '.package_type == "container"
                 and .name == "hermes-agent"
                 and .visibility == "public"
                 and .repository.full_name == "ragnos-labs/hermes-agent"' \
            "$package_json" >/dev/null
          gh api --paginate --slurp \
            "orgs/ragnos-labs/packages/container/hermes-agent/versions?state=active&per_page=100" \
            > "$active_versions"
          gh api --paginate --slurp \
            "orgs/ragnos-labs/packages/container/hermes-agent/versions?state=deleted&per_page=100" \
            > "$deleted_versions"
          ACTIVE_VERSIONS="$active_versions" DELETED_VERSIONS="$deleted_versions" \
          RELEASE_TAG="$RELEASE_TAG" python3 - <<'PY'
          import json
          import os

          def versions(name):
              pages = json.load(open(os.environ[name], encoding="utf-8"))
              return [item for page in pages for item in page]

          for state in ("ACTIVE_VERSIONS", "DELETED_VERSIONS"):
              for version in versions(state):
                  tags = version.get("metadata", {}).get("container", {}).get("tags", [])
                  assert os.environ["RELEASE_TAG"] not in tags, (state, version.get("id"))
          PY

          tag_status="$(curl --silent --show-error --output "$tag_probe" --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${REPOSITORY}/git/ref/tags/${RELEASE_TAG}")"
          [ "$tag_status" = "404" ] || {
            echo "::error::The protected release tag is not absent (HTTP ${tag_status})."
            exit 1
          }

          gh api --paginate --slurp "repos/${REPOSITORY}/rulesets?includes_parents=true&per_page=100" > "$rulesets"
          RULESETS="$rulesets" REPOSITORY="$REPOSITORY" GH_TOKEN="$GH_TOKEN" \
          python3 - <<'PY'
          import json
          import os
          import subprocess

          pages = json.load(open(os.environ["RULESETS"], encoding="utf-8"))
          summaries = [item for page in pages for item in page]
          accepted = []
          for summary in summaries:
              if summary.get("id") != 20903555:
                  continue
              if summary.get("enforcement") != "active" or summary.get("target") != "tag":
                  continue
              result = subprocess.run(
                  ["gh", "api", f"repos/{os.environ['REPOSITORY']}/rulesets/{summary['id']}"],
                  check=True,
                  capture_output=True,
                  text=True,
                  env={"GH_TOKEN": os.environ["GH_TOKEN"]},
              )
              rule = json.loads(result.stdout)
              include = rule.get("conditions", {}).get("ref_name", {}).get("include", [])
              types = {item.get("type") for item in rule.get("rules", [])}
              if (
                  "refs/tags/v20*" in include
                  and "deletion" in types
                  and "update" in types
                  and "creation" not in types
              ):
                  accepted.append(rule["id"])
          assert accepted == [20903555], accepted
          PY

          jq -n --arg ref "refs/tags/${RELEASE_TAG}" --arg sha "$SOURCE_SHA" \
            '{ref: $ref, sha: $sha}' > "$RUNNER_TEMP/maintenance-create-ref-request.json"
          # Atomic create-only lock. Never retry, update, move, or delete this ref.
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --data-binary "@$RUNNER_TEMP/maintenance-create-ref-request.json" \
            "https://api.github.com/repos/${REPOSITORY}/git/refs" > "$tag_create"
          jq -e --arg ref "refs/tags/${RELEASE_TAG}" --arg sha "$SOURCE_SHA" \
            '.ref == $ref and .object.type == "commit" and .object.sha == $sha' "$tag_create" >/dev/null
          [ "$(gh api "repos/${REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq .object.sha)" = "$SOURCE_SHA" ]

          jq -n \
            --arg release_tag "$RELEASE_TAG" \
            --arg source_sha "$SOURCE_SHA" \
            --arg source_tree "$SOURCE_TREE" \
            --arg workflow_sha "$WORKFLOW_SHA" \
            --arg run_id "$WORKFLOW_RUN_ID" \
            --arg run_attempt "$WORKFLOW_RUN_ATTEMPT" \
            --arg approval_digest "$APPROVAL_DIGEST" \
            '{receipt_version:"hermes.execution.read.github-release-lock.v1",
              status:"created", release_tag:$release_tag,
              source:{sha:$source_sha,tree:$source_tree},
              workflow:{sha:$workflow_sha,run_id:$run_id,run_attempt:$run_attempt},
              collision:{git_ref:"absent",active_versions:"absent",deleted_versions:"absent"},
              package_link:{linked_repository:"ragnos-labs/hermes-agent",visibility:"public"},
              privileged_review:{environment:"hermes-execution-read-release",receipt_digest:$approval_digest,
                covers:["organization_audit_180d","package_acl","workflow_writer","tag_ruleset"]},
              recovery:{state:"immutable_tag_created",instruction:"Never move or delete the tag; reconcile partial registry state before any successor."}}' \
            > "$receipt"
          receipt_sha256="$(sha256sum "$receipt" | cut -d' ' -f1)"
          echo "tag_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "receipt_sha256=$receipt_sha256" >> "$GITHUB_OUTPUT"

      - name: Enforce release-lock artifact cap
        if: always()
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/maintenance-release-lock.json"
          [ ! -e "$candidate" ] || [ "$(stat -c %s "$candidate")" -le 262144 ]

      - name: Upload maintenance release-lock receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghcr-execution-read-release-lock-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/maintenance-release-lock.json
          if-no-files-found: ignore
          retention-days: 89

  registry-preflight:
    name: Authenticated destination preflight
    if: always() && needs.resolve.outputs.publish == 'true' && needs.authorize.result == 'success' && (needs.resolve.outputs.maintenance != 'true' || needs.release-lock.result == 'success') && github.repository == 'ragnos-labs/hermes-agent'
    needs: [resolve, authorize, release-lock]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      SCHEMA_SHA256: ${{ needs.resolve.outputs.schema_sha256 }}
      ACTION_SCHEMA_SHA256: ${{ needs.resolve.outputs.action_schema_sha256 }}
    outputs:
      rebuild: ${{ steps.preflight.outputs.rebuild }}
      sha_state: ${{ steps.preflight.outputs.sha_state }}
      sha_digest: ${{ steps.preflight.outputs.sha_digest }}
      release_state: ${{ steps.preflight.outputs.release_state }}
      release_digest: ${{ steps.preflight.outputs.release_digest }}
    steps:
      - name: Check out audited workflow revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize audited registry policy outside the source checkout
        env:
          WORKFLOW_SHA: ${{ needs.resolve.outputs.workflow_sha }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin refs/heads/main
          [ "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$WORKFLOW_SHA" ] || {
            echo "::error::Protected main moved before audited registry policy could be materialized."
            exit 1
          }
          classifier_spec="${WORKFLOW_SHA}:scripts/ci/classify_ghcr_release_absence.py"
          [ "$(git cat-file -t "$classifier_spec")" = blob ]
          expected_blob="$(git rev-parse --verify "$classifier_spec")"
          policy_root="$(mktemp -d "$RUNNER_TEMP/audited-workflow-policy.XXXXXX")"
          classifier_path="$policy_root/classify_ghcr_release_absence.py"
          git show "$classifier_spec" > "$classifier_path"
          [ "$(git hash-object "$classifier_path")" = "$expected_blob" ] || {
            echo "::error::Materialized registry policy does not match the audited workflow revision."
            exit 1
          }
          echo "AUDITED_GHCR_ABSENCE_CLASSIFIER=$classifier_path" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to fork-owned GHCR for authenticated inspection
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Fail-closed preflight before any child rebuild or push
        id: preflight
        env:
          RECEIPT_PATH: ${{ runner.temp }}/ghcr-execution-read-preflight.json
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          SOURCE_REF: ${{ needs.resolve.outputs.source_ref }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          WORKFLOW_REF: ${{ needs.resolve.outputs.workflow_ref }}
          WORKFLOW_RUN_ATTEMPT: ${{ needs.resolve.outputs.workflow_run_attempt }}
          WORKFLOW_RUN_ID: ${{ needs.resolve.outputs.workflow_run_id }}
          WORKFLOW_SHA: ${{ needs.resolve.outputs.workflow_sha }}
        run: |
          set -euo pipefail
          [ "$IMAGE_NAME" = "ghcr.io/ragnos-labs/hermes-agent" ]
          [ "$SOURCE_REF" = "refs/tags/${RELEASE_TAG}" ]

          record_preflight_failure() {
            RECEIPT_PATH="$RECEIPT_PATH" FAILURE_STATUS="$1" FAILURE_STATE="$2" \
            RELEASE_TAG="$RELEASE_TAG" SOURCE_REF="$SOURCE_REF" SOURCE_SHA="$SOURCE_SHA" \
            WORKFLOW_REF="$WORKFLOW_REF" WORKFLOW_SHA="$WORKFLOW_SHA" \
            WORKFLOW_RUN_ID="$WORKFLOW_RUN_ID" WORKFLOW_RUN_ATTEMPT="$WORKFLOW_RUN_ATTEMPT" \
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          Path(os.environ["RECEIPT_PATH"]).write_text(json.dumps({
              "receipt_version": "hermes.execution.read.release-receipt.v1",
              "status": os.environ["FAILURE_STATUS"],
              "destination": "ghcr.io/ragnos-labs/hermes-agent",
              "release_tag": os.environ["RELEASE_TAG"],
              "source": {"sha": os.environ["SOURCE_SHA"], "ref": os.environ["SOURCE_REF"]},
              "workflow": {
                  "sha": os.environ["WORKFLOW_SHA"],
                  "ref": os.environ["WORKFLOW_REF"],
                  "run_id": os.environ["WORKFLOW_RUN_ID"],
                  "run_attempt": os.environ["WORKFLOW_RUN_ATTEMPT"],
              },
              "contract": "hermes.execution.read.v1",
              "schema_sha256": "7b2c4569d52a048c31a5a42861817b748e5742ce6cac6eafba1d41dc090340c3",
              "tag_states": {"preflight": {}, "final": {}},
              "recovery": {"state": os.environ["FAILURE_STATE"], "instruction": "No registry mutation is allowed. Reinspect with authenticated registry access and reconcile with the pilot."},
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          }

          explicit_absence() {
            python3 "$AUDITED_GHCR_ABSENCE_CLASSIFIER" "$1"
          }

          inspect_ref() {
            local ref="$1" raw_path="$2" digest_path="$3" state_path="$4"
            local attempt raw_tmp digest_tmp error_path saw_unknown=false
            rm -f "$raw_path" "$digest_path" "$state_path"
            error_path="${raw_path}.error"
            for attempt in 1 2 3; do
              raw_tmp="${raw_path}.attempt-${attempt}"
              digest_tmp="${digest_path}.attempt-${attempt}"
              : > "$error_path"
              if timeout 45 docker buildx imagetools inspect "$ref" --raw > "$raw_tmp" 2> "$error_path"; then
                if timeout 45 docker buildx imagetools inspect "$ref" > "$digest_tmp" 2>> "$error_path" && \
                  RAW_PATH="$raw_tmp" DIGEST_OUTPUT="$digest_tmp" python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          payload = json.loads(Path(os.environ["RAW_PATH"]).read_text(encoding="utf-8"))
          assert isinstance(payload, dict) and payload, "malformed registry manifest"
          text = Path(os.environ["DIGEST_OUTPUT"]).read_text(encoding="utf-8")
          match = re.search(r"(?m)^Digest:\s+(sha256:[0-9a-f]{64})\s*$", text)
          assert match, "missing canonical registry digest"
          Path(os.environ["DIGEST_OUTPUT"]).write_text(match.group(1) + "\n", encoding="utf-8")
          PY
                then
                  mv "$raw_tmp" "$raw_path"
                  mv "$digest_tmp" "$digest_path"
                  echo present > "$state_path"
                  rm -f "$error_path"
                  return 0
                fi
                saw_unknown=true
              elif explicit_absence "$error_path"; then
                rm -f "$raw_tmp" "$digest_tmp"
                if [ "$attempt" -eq 3 ] && [ "$saw_unknown" = false ]; then
                  echo absent > "$state_path"
                  rm -f "$error_path"
                  return 0
                fi
              else
                saw_unknown=true
                rm -f "$raw_tmp" "$digest_tmp"
              fi
              echo "::warning::Authenticated registry inspection attempt ${attempt}/3 was not conclusive for ${ref}."
              sleep "$attempt"
            done
            rm -f "$error_path"
            return 1
          }

          git fetch --force --no-tags origin refs/heads/main
          current_main="$(git rev-parse 'FETCH_HEAD^{commit}')"
          git fetch --force --no-tags origin "$SOURCE_REF"
          resolved_source="$(git rev-parse 'FETCH_HEAD^{commit}')"
          [ "$current_main" = "$WORKFLOW_SHA" ] || {
            record_preflight_failure workflow_revision_stale main_moved
            exit 1
          }
          [ "$resolved_source" = "$SOURCE_SHA" ] || {
            record_preflight_failure source_tag_moved moved_tag
            exit 1
          }
          if [ "$MAINTENANCE" = true ]; then
            [ "$SOURCE_SHA" = "$MAINTENANCE_SOURCE_SHA" ]
            [ "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$MAINTENANCE_SOURCE_TREE" ]
          else
            git merge-base --is-ancestor "$SOURCE_SHA" "$WORKFLOW_SHA" || {
              record_preflight_failure source_not_ancestor_of_workflow invalid_ancestry
              exit 1
            }
          fi

          sha_ref="${IMAGE_NAME}:sha-${SOURCE_SHA}"
          release_ref="${IMAGE_NAME}:${RELEASE_TAG}"
          sha_raw="$RUNNER_TEMP/preflight-sha.json"
          sha_digest_path="$RUNNER_TEMP/preflight-sha.digest"
          sha_state_path="$RUNNER_TEMP/preflight-sha.state"
          release_raw="$RUNNER_TEMP/preflight-release.json"
          release_digest_path="$RUNNER_TEMP/preflight-release.digest"
          release_state_path="$RUNNER_TEMP/preflight-release.state"
          inspect_ref "$sha_ref" "$sha_raw" "$sha_digest_path" "$sha_state_path" || {
            record_preflight_failure registry_inspection_unknown sha_inspection_unknown
            exit 1
          }
          inspect_ref "$release_ref" "$release_raw" "$release_digest_path" "$release_state_path" || {
            record_preflight_failure registry_inspection_unknown release_inspection_unknown
            exit 1
          }

          RECEIPT_PATH="$RECEIPT_PATH" RELEASE_RAW="$release_raw" RELEASE_DIGEST_PATH="$release_digest_path" \
          RELEASE_STATE_PATH="$release_state_path" SHA_RAW="$sha_raw" SHA_DIGEST_PATH="$sha_digest_path" \
          SHA_STATE_PATH="$sha_state_path" SOURCE_REF="$SOURCE_REF" SOURCE_SHA="$SOURCE_SHA" \
          RELEASE_TAG="$RELEASE_TAG" WORKFLOW_REF="$WORKFLOW_REF" WORKFLOW_SHA="$WORKFLOW_SHA" \
          WORKFLOW_RUN_ID="$WORKFLOW_RUN_ID" WORKFLOW_RUN_ATTEMPT="$WORKFLOW_RUN_ATTEMPT" \
          GITHUB_OUTPUT="$GITHUB_OUTPUT" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def classify(prefix):
              state = Path(os.environ[f"{prefix}_STATE_PATH"]).read_text(encoding="utf-8").strip()
              if state == "absent":
                  return {"state": "absent", "digest": None}
              raw = json.loads(Path(os.environ[f"{prefix}_RAW"]).read_text(encoding="utf-8"))
              manifests = raw.get("manifests", [])
              runtime = {
                  (item.get("platform", {}).get("os"), item.get("platform", {}).get("architecture")): item.get("digest")
                  for item in manifests if item.get("platform", {}).get("os") == "linux"
              }
              attested = {
                  item.get("annotations", {}).get("vnd.docker.reference.digest")
                  for item in manifests
                  if item.get("annotations", {}).get("vnd.docker.reference.type") == "attestation-manifest"
              }
              annotations = raw.get("annotations", {})
              matches = (
                  set(runtime) == {("linux", "amd64"), ("linux", "arm64")}
                  and set(runtime.values()).issubset(attested)
                  and annotations.get("org.opencontainers.image.revision") == os.environ["SOURCE_SHA"]
                  and annotations.get("io.ragnos.hermes.execution.contract") == "hermes.execution.read.v1"
                  and annotations.get("io.ragnos.hermes.execution.schema-sha256") == "7b2c4569d52a048c31a5a42861817b748e5742ce6cac6eafba1d41dc090340c3"
                  and annotations.get("io.ragnos.hermes.execution.action-contract") == "hermes.execution.action.v1"
                  and annotations.get("io.ragnos.hermes.execution.action-schema-sha256") == os.environ["ACTION_SCHEMA_SHA256"]
                  and annotations.get("io.ragnos.hermes.execution.action-source-sha") == os.environ["SOURCE_SHA"]
              )
              digest = Path(os.environ[f"{prefix}_DIGEST_PATH"]).read_text(encoding="utf-8").strip()
              return {"state": "matching" if matches else "conflict", "digest": digest}

          sha = classify("SHA")
          release = classify("RELEASE")
          errors = []
          if release["state"] == "conflict":
              errors.append("release tag conflicts")
          if sha["state"] == "conflict":
              errors.append("SHA tag conflicts")
          if sha["state"] == release["state"] == "matching" and sha["digest"] != release["digest"]:
              errors.append("matching-content tags resolve to different digests")
          rebuild = sha["state"] == release["state"] == "absent"
          receipt = {
              "receipt_version": "hermes.execution.read.release-receipt.v1",
              "status": "conflict" if errors else "preflight_passed",
              "destination": "ghcr.io/ragnos-labs/hermes-agent",
              "release_tag": os.environ["RELEASE_TAG"],
              "source": {"sha": os.environ["SOURCE_SHA"], "ref": os.environ["SOURCE_REF"]},
              "workflow": {"sha": os.environ["WORKFLOW_SHA"], "ref": os.environ["WORKFLOW_REF"], "run_id": os.environ["WORKFLOW_RUN_ID"], "run_attempt": os.environ["WORKFLOW_RUN_ATTEMPT"]},
              "contract": "hermes.execution.read.v1",
              "schema_sha256": "7b2c4569d52a048c31a5a42861817b748e5742ce6cac6eafba1d41dc090340c3",
              "children": {}, "orphan_children": {}, "missing_architectures": [],
              "tag_states": {"preflight": {"sha": sha, "release": release}, "final": {}},
              "index_digest": None,
              "recovery": {"state": "conflict" if errors else "preflight_passed", "instruction": "Do not mutate on conflict; otherwise reuse exact proved digests or rebuild only when both destination tags are absent."},
          }
          Path(os.environ["RECEIPT_PATH"]).write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"rebuild={'true' if rebuild else 'false'}\n")
              output.write(f"sha_state={sha['state']}\nsha_digest={sha['digest'] or ''}\n")
              output.write(f"release_state={release['state']}\nrelease_digest={release['digest'] or ''}\n")
          print(json.dumps(receipt, indent=2, sort_keys=True))
          if errors:
              raise SystemExit("; ".join(errors))
          PY

      - name: Enforce preflight artifact cap
        if: always()
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/ghcr-execution-read-preflight.json"
          [ ! -e "$candidate" ] || [ "$(stat -c %s "$candidate")" -le 524288 ]

      - name: Upload current-attempt preflight receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghcr-execution-read-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ghcr-execution-read-preflight.json
          if-no-files-found: error
          retention-days: 89

  publish:
    name: Publish untagged digest (${{ matrix.arch }})
    if: needs.resolve.outputs.publish == 'true' && needs.registry-preflight.outputs.rebuild == 'true' && github.repository == 'ragnos-labs/hermes-agent'
    needs: [resolve, authorize, registry-preflight]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
            cache-from: type=gha,scope=ghcr-execution-read-amd64
            cache-to: type=gha,mode=max,scope=ghcr-execution-read-amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            cache-from: type=gha,scope=ghcr-execution-read-arm64
            cache-to: type=gha,mode=max,scope=ghcr-execution-read-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    env:
      SCHEMA_SHA256: ${{ needs.resolve.outputs.schema_sha256 }}
      ACTION_SCHEMA_SHA256: ${{ needs.resolve.outputs.action_schema_sha256 }}
    steps:
      - name: Verify exact publication runner
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          RUNNER_ARCH: ${{ runner.arch }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          [ "$RUNNER_OS" = "Linux" ]
          case "$EXPECTED_ARCH" in
            amd64) [ "$RUNNER_ARCH" = "X64" ] ;;
            arm64) [ "$RUNNER_ARCH" = "ARM64" ] ;;
            *) exit 1 ;;
          esac

      - name: Check out exact approved source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Re-prove approved source and schema
        env:
          ARCH: ${{ matrix.arch }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          SOURCE_REF: ${{ needs.resolve.outputs.source_ref }}
          WORKFLOW_RUN_ATTEMPT: ${{ needs.resolve.outputs.workflow_run_attempt }}
          WORKFLOW_RUN_ID: ${{ needs.resolve.outputs.workflow_run_id }}
          WORKFLOW_SHA: ${{ needs.resolve.outputs.workflow_sha }}
        run: |
          set -euo pipefail
          [ "$IMAGE_NAME" = "ghcr.io/ragnos-labs/hermes-agent" ]
          evidence_dir="$RUNNER_TEMP/publication-evidence/${ARCH}"
          mkdir -p "$evidence_dir"
          record_arch_failure() {
            RECEIPT_JSON="$evidence_dir/architecture.json" FAILURE_STATUS="$1" ARCH="$ARCH" \
            SOURCE_SHA="$SOURCE_SHA" SOURCE_REF="$SOURCE_REF" WORKFLOW_SHA="$WORKFLOW_SHA" \
            WORKFLOW_RUN_ID="$WORKFLOW_RUN_ID" WORKFLOW_RUN_ATTEMPT="$WORKFLOW_RUN_ATTEMPT" \
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          Path(os.environ["RECEIPT_JSON"]).write_text(json.dumps({
              "architecture": os.environ["ARCH"],
              "status": os.environ["FAILURE_STATUS"],
              "source_sha": os.environ["SOURCE_SHA"],
              "source_ref": os.environ["SOURCE_REF"],
              "workflow_sha": os.environ["WORKFLOW_SHA"],
              "workflow_run_id": os.environ["WORKFLOW_RUN_ID"],
              "workflow_run_attempt": os.environ["WORKFLOW_RUN_ATTEMPT"],
              "pushed_digest_verified": False,
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          }
          git fetch --force --no-tags origin refs/heads/main
          [ "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$WORKFLOW_SHA" ] || {
            record_arch_failure workflow_revision_stale
            echo "::error::main moved after the audited workflow revision; no digest may be pushed."
            exit 1
          }
          git fetch --force --no-tags origin "$SOURCE_REF" || {
            record_arch_failure source_tag_unavailable
            exit 1
          }
          [ "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$SOURCE_SHA" ] || {
            record_arch_failure source_tag_moved
            exit 1
          }
          [ "$(git rev-parse 'HEAD^{commit}')" = "$SOURCE_SHA" ] || {
            record_arch_failure source_checkout_mismatch
            exit 1
          }
          if [ "$MAINTENANCE" = true ]; then
            [ "$SOURCE_SHA" = "$MAINTENANCE_SOURCE_SHA" ]
            [ "$(git rev-parse 'HEAD^{tree}')" = "$MAINTENANCE_SOURCE_TREE" ]
          else
            git merge-base --is-ancestor "$SOURCE_SHA" "$WORKFLOW_SHA" || {
              record_arch_failure source_not_ancestor_of_workflow
              echo "::error::SOURCE_SHA is not an ancestor of WORKFLOW_SHA/current main; no digest may be pushed."
              exit 1
            }
          fi
          printf '%s  %s\n' "$SCHEMA_SHA256" "$SCHEMA_PATH" | sha256sum -c -
          printf '%s  %s\n' "$ACTION_SCHEMA_SHA256" "$ACTION_SCHEMA_PATH" | sha256sum -c -

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to fork-owned GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Rebuild exact source and push by digest only
        id: push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/ragnos-labs/hermes-agent
            org.opencontainers.image.revision=${{ needs.resolve.outputs.source_sha }}
            io.ragnos.hermes.execution.contract=${{ env.CONTRACT_VERSION }}
            io.ragnos.hermes.execution.schema-sha256=${{ env.SCHEMA_SHA256 }}
            io.ragnos.hermes.execution.action-contract=${{ env.ACTION_CONTRACT_VERSION }}
            io.ragnos.hermes.execution.action-schema-sha256=${{ env.ACTION_SCHEMA_SHA256 }}
            io.ragnos.hermes.execution.action-source-sha=${{ needs.resolve.outputs.source_sha }}
          build-args: |
            HERMES_GIT_SHA=${{ needs.resolve.outputs.source_sha }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: ${{ matrix.cache-from }}
          cache-to: ${{ needs.resolve.outputs.maintenance == 'true' && '' || matrix.cache-to }}

      - name: Initialize pushed-digest recovery evidence
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.push.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
          SOURCE_REF: ${{ needs.resolve.outputs.source_ref }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          WORKFLOW_REF: ${{ needs.resolve.outputs.workflow_ref }}
          WORKFLOW_RUN_ID: ${{ needs.resolve.outputs.workflow_run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ needs.resolve.outputs.workflow_run_attempt }}
          WORKFLOW_SHA: ${{ needs.resolve.outputs.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          evidence_dir="$RUNNER_TEMP/publication-evidence/${ARCH}"
          mkdir -p "$evidence_dir"
          ARCH="$ARCH" \
          DIGEST="$DIGEST" \
          PLATFORM="$PLATFORM" \
          RECEIPT_JSON="$evidence_dir/architecture.json" \
          SOURCE_REF="$SOURCE_REF" \
          SOURCE_SHA="$SOURCE_SHA" \
          WORKFLOW_REF="$WORKFLOW_REF" \
          WORKFLOW_RUN_ID="$WORKFLOW_RUN_ID" \
          WORKFLOW_RUN_ATTEMPT="$WORKFLOW_RUN_ATTEMPT" \
          WORKFLOW_SHA="$WORKFLOW_SHA" \
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = {
              "architecture": os.environ["ARCH"],
              "platform": os.environ["PLATFORM"],
              "build_index_digest": os.environ["DIGEST"],
              "source_sha": os.environ["SOURCE_SHA"],
              "source_ref": os.environ["SOURCE_REF"],
              "workflow_sha": os.environ["WORKFLOW_SHA"],
              "workflow_ref": os.environ["WORKFLOW_REF"],
              "workflow_run_id": os.environ["WORKFLOW_RUN_ID"],
              "workflow_run_attempt": os.environ["WORKFLOW_RUN_ATTEMPT"],
              "contract": "hermes.execution.read.v1",
              "schema_sha256": "7b2c4569d52a048c31a5a42861817b748e5742ce6cac6eafba1d41dc090340c3",
              "status": "pushed_unverified",
              "pushed_digest_verified": False,
              "provenance_present": False,
              "sbom_present": False,
          }
          Path(os.environ["RECEIPT_JSON"]).write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Re-prove the actual pushed digest and attestations
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.push.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          SOURCE_REF: ${{ needs.resolve.outputs.source_ref }}
          WORKFLOW_REF: ${{ needs.resolve.outputs.workflow_ref }}
          WORKFLOW_SHA: ${{ needs.resolve.outputs.workflow_sha }}
          WORKFLOW_RUN_ID: ${{ needs.resolve.outputs.workflow_run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ needs.resolve.outputs.workflow_run_attempt }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          published_ref="${IMAGE_NAME}@${DIGEST}"
          evidence_dir="$RUNNER_TEMP/publication-evidence/${ARCH}"
          mkdir -p "$evidence_dir"

          docker pull "$published_ref"
          revision="$(docker image inspect "$published_ref" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          contract="$(docker image inspect "$published_ref" --format '{{ index .Config.Labels "io.ragnos.hermes.execution.contract" }}')"
          schema_digest="$(docker image inspect "$published_ref" --format '{{ index .Config.Labels "io.ragnos.hermes.execution.schema-sha256" }}')"
          action_contract="$(docker image inspect "$published_ref" --format '{{ index .Config.Labels "io.ragnos.hermes.execution.action-contract" }}')"
          action_schema_digest="$(docker image inspect "$published_ref" --format '{{ index .Config.Labels "io.ragnos.hermes.execution.action-schema-sha256" }}')"
          action_source_sha="$(docker image inspect "$published_ref" --format '{{ index .Config.Labels "io.ragnos.hermes.execution.action-source-sha" }}')"
          [ "$revision" = "$SOURCE_SHA" ]
          [ "$contract" = "$CONTRACT_VERSION" ]
          [ "$schema_digest" = "$SCHEMA_SHA256" ]
          [ "$action_contract" = "$ACTION_CONTRACT_VERSION" ]
          [ "$action_schema_digest" = "$ACTION_SCHEMA_SHA256" ]
          [ "$action_source_sha" = "$SOURCE_SHA" ]

          docker run --rm -i \
            -e EXPECTED_SOURCE_SHA="$SOURCE_SHA" \
            -e ACTION_SCHEMA_SHA256="$ACTION_SCHEMA_SHA256" \
            --entrypoint /opt/hermes/.venv/bin/python "$published_ref" - <<'PY'
          import hashlib
          import os
          from importlib.resources import files
          from pathlib import Path

          from jsonschema.validators import Draft202012Validator

          from hermes_cli.execution_contract import (
              ACTION_CONTRACT_VERSION,
              CONTRACT_VERSION,
              action_contract_schema,
              contract_schema,
          )

          expected_schema_sha = "7b2c4569d52a048c31a5a42861817b748e5742ce6cac6eafba1d41dc090340c3"
          expected_action_schema_sha = os.environ["ACTION_SCHEMA_SHA256"]
          embedded_source = Path("/opt/hermes/.hermes_build_sha").read_text().strip()
          packaged_schema = files("hermes_cli").joinpath(
              "execution_contract_schemas/hermes.execution.read.v1.schema.json"
          )
          schema = contract_schema()
          Draft202012Validator.check_schema(schema)
          actual_schema_sha = hashlib.sha256(packaged_schema.read_bytes()).hexdigest()
          packaged_action_schema = files("hermes_cli").joinpath(
              "execution_contract_schemas/hermes.execution.action.v1.schema.json"
          )
          action_schema = action_contract_schema()
          Draft202012Validator.check_schema(action_schema)
          actual_action_schema_sha = hashlib.sha256(
              packaged_action_schema.read_bytes()
          ).hexdigest()
          assert embedded_source == os.environ["EXPECTED_SOURCE_SHA"], embedded_source
          assert CONTRACT_VERSION == "hermes.execution.read.v1", CONTRACT_VERSION
          assert schema["$id"].endswith("hermes.execution.read.v1.schema.json")
          assert actual_schema_sha == expected_schema_sha, actual_schema_sha
          assert ACTION_CONTRACT_VERSION == "hermes.execution.action.v1"
          assert action_schema["$id"].endswith(
              "hermes.execution.action.v1.schema.json"
          )
          assert actual_action_schema_sha == expected_action_schema_sha
          print("pushed_digest_contract_closure=passed")
          PY

          docker buildx imagetools inspect "$published_ref" --raw > "$evidence_dir/index.json"
          docker buildx imagetools inspect "$published_ref" \
            --format '{{ json .Provenance }}' > "$evidence_dir/provenance.json"
          docker buildx imagetools inspect "$published_ref" \
            --format '{{ json .SBOM }}' > "$evidence_dir/sbom.json"

          ARCH="$ARCH" \
          BUILD_INDEX_DIGEST="$DIGEST" \
          CONTRACT_VERSION="$CONTRACT_VERSION" \
          INDEX_JSON="$evidence_dir/index.json" \
          PLATFORM="$PLATFORM" \
          RECEIPT_JSON="$evidence_dir/architecture.json" \
          SCHEMA_SHA256="$SCHEMA_SHA256" \
          SOURCE_REF="$SOURCE_REF" \
          SOURCE_SHA="$SOURCE_SHA" \
          WORKFLOW_REF="$WORKFLOW_REF" \
          WORKFLOW_RUN_ID="$WORKFLOW_RUN_ID" \
          WORKFLOW_RUN_ATTEMPT="$WORKFLOW_RUN_ATTEMPT" \
          WORKFLOW_SHA="$WORKFLOW_SHA" \
          python3 - <<'PY'
          import json
          import os

          def load_nonempty(path):
              value = json.load(open(path, encoding="utf-8"))
              assert value not in (None, {}, []), f"missing attestation: {path}"
              return value

          payload = json.load(open(os.environ["INDEX_JSON"], encoding="utf-8"))
          manifests = payload.get("manifests", [])
          runtime = [
              item for item in manifests
              if item.get("platform", {}).get("architecture") == os.environ["ARCH"]
              and item.get("platform", {}).get("os") == "linux"
          ]
          attestations = [
              item for item in manifests
              if item.get("annotations", {}).get("vnd.docker.reference.type") == "attestation-manifest"
          ]
          assert len(runtime) == 1, runtime
          assert attestations, "published digest is missing provenance/SBOM attestation descriptors"
          load_nonempty(os.path.join(os.path.dirname(os.environ["INDEX_JSON"]), "provenance.json"))
          load_nonempty(os.path.join(os.path.dirname(os.environ["INDEX_JSON"]), "sbom.json"))
          receipt = json.load(open(os.environ["RECEIPT_JSON"], encoding="utf-8"))
          receipt.update({
              "runtime_digest": runtime[0]["digest"],
              "attestation_digests": [item["digest"] for item in attestations],
              "status": "verified",
              "pushed_digest_verified": True,
              "provenance_present": True,
              "sbom_present": True,
          })
          assert receipt["architecture"] == os.environ["ARCH"]
          assert receipt["platform"] == os.environ["PLATFORM"]
          assert receipt["build_index_digest"] == os.environ["BUILD_INDEX_DIGEST"]
          assert receipt["source_sha"] == os.environ["SOURCE_SHA"]
          assert receipt["source_ref"] == os.environ["SOURCE_REF"]
          assert receipt["workflow_sha"] == os.environ["WORKFLOW_SHA"]
          assert receipt["workflow_ref"] == os.environ["WORKFLOW_REF"]
          assert receipt["workflow_run_id"] == os.environ["WORKFLOW_RUN_ID"]
          assert receipt["workflow_run_attempt"] == os.environ["WORKFLOW_RUN_ATTEMPT"]
          assert receipt["contract"] == os.environ["CONTRACT_VERSION"]
          assert receipt["schema_sha256"] == os.environ["SCHEMA_SHA256"]
          with open(os.environ["RECEIPT_JSON"], "w", encoding="utf-8") as handle:
              json.dump(receipt, handle, indent=2, sort_keys=True)
              handle.write("\n")
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Enforce per-architecture artifact cap
        if: always()
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/publication-evidence/${{ matrix.arch }}"
          [ ! -e "$candidate" ] || [ "$(du -sb "$candidate" | cut -f1)" -le 10485760 ]

      - name: Upload durable architecture proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghcr-execution-read-proof-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-evidence/${{ matrix.arch }}
          if-no-files-found: ignore
          retention-days: 89

  manifest:
    name: Publish immutable SHA and approved release tag
    if: always() && needs.resolve.outputs.publish == 'true' && needs.authorize.result == 'success' && needs.registry-preflight.result == 'success' && github.repository == 'ragnos-labs/hermes-agent'
    needs: [resolve, authorize, registry-preflight, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
      receipt_digest: ${{ steps.receipt.outputs.digest }}
      action_receipt_digest: ${{ steps.action-receipt.outputs.digest }}
    env:
      SCHEMA_SHA256: ${{ needs.resolve.outputs.schema_sha256 }}
      ACTION_SCHEMA_SHA256: ${{ needs.resolve.outputs.action_schema_sha256 }}
    steps:
      - name: Download current-attempt authenticated preflight receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ${{ runner.temp }}/publication-preflight
          name: ghcr-execution-read-preflight-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Download current-attempt architecture proofs
        id: download
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ${{ runner.temp }}/publication-proofs
          pattern: ghcr-execution-read-proof-*-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Initialize recoverable publication receipt
        id: children
        env:
          PROOF_DIR: ${{ runner.temp }}/publication-proofs
          PREFLIGHT_RECEIPT: ${{ runner.temp }}/publication-preflight/ghcr-execution-read-preflight.json
          REBUILD: ${{ needs.registry-preflight.outputs.rebuild }}
          RECEIPT_PATH: ${{ runner.temp }}/ghcr-execution-read-receipt.json
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          SOURCE_REF: ${{ needs.resolve.outputs.source_ref }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          WORKFLOW_REF: ${{ needs.resolve.outputs.workflow_ref }}
          WORKFLOW_RUN_ID: ${{ needs.resolve.outputs.workflow_run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ needs.resolve.outputs.workflow_run_attempt }}
          WORKFLOW_SHA: ${{ needs.resolve.outputs.workflow_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(Path(os.environ["PREFLIGHT_RECEIPT"]).read_text(encoding="utf-8"))
          expected_workflow = {
              "sha": os.environ["WORKFLOW_SHA"],
              "ref": os.environ["WORKFLOW_REF"],
              "run_id": os.environ["WORKFLOW_RUN_ID"],
              "run_attempt": os.environ["WORKFLOW_RUN_ATTEMPT"],
          }
          assert receipt["source"] == {"sha": os.environ["SOURCE_SHA"], "ref": os.environ["SOURCE_REF"]}
          assert receipt["workflow"] == expected_workflow
          assert receipt["release_tag"] == os.environ["RELEASE_TAG"]

          proof_root = Path(os.environ["PROOF_DIR"])
          children = {}
          orphan_children = {}
          missing = []
          rebuild = os.environ["REBUILD"] == "true"
          for arch in (("amd64", "arm64") if rebuild else ()):
              artifact = f"ghcr-execution-read-proof-{arch}-{os.environ['WORKFLOW_RUN_ID']}-{os.environ['WORKFLOW_RUN_ATTEMPT']}"
              path = proof_root / artifact / "architecture.json"
              if not path.is_file():
                  missing.append(arch)
                  continue
              proof = json.loads(path.read_text(encoding="utf-8"))
              errors = []
              expected = {
                  "architecture": arch,
                  "source_sha": os.environ["SOURCE_SHA"],
                  "source_ref": os.environ["SOURCE_REF"],
                  "workflow_sha": os.environ["WORKFLOW_SHA"],
                  "workflow_ref": os.environ["WORKFLOW_REF"],
                  "workflow_run_id": os.environ["WORKFLOW_RUN_ID"],
                  "workflow_run_attempt": os.environ["WORKFLOW_RUN_ATTEMPT"],
              }
              for key, value in expected.items():
                  if proof.get(key) != value:
                      errors.append(f"{key} mismatch")
              for key in ("pushed_digest_verified", "provenance_present", "sbom_present"):
                  if proof.get(key) is not True:
                      errors.append(f"{key} is not true")
              if errors:
                  missing.append(arch)
                  orphan_children[arch] = {"proof": proof, "errors": errors}
                  continue
              children[arch] = proof

          ready = not missing
          receipt["status"] = "children_ready" if ready else "partial_children"
          receipt["children"] = children
          receipt["orphan_children"] = orphan_children
          receipt["missing_architectures"] = missing
          receipt["recovery"] = {
              "state": "ready_for_finalization" if ready else "orphan_children",
              "instruction": (
                  "Preserve the orphan child evidence and stop for a separately admitted successor; no second dispatch is authorized."
                  if missing else
                  "Finalize only from exact preflight or current-attempt child digests; any ambiguous delivery is terminal pending fresh governance."
              ),
          }
          Path(os.environ["RECEIPT_PATH"]).write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"ready={'true' if ready else 'false'}\n")
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Check out exact source for final tag proof
        if: steps.children.outputs.ready == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize audited registry policy outside the source checkout
        if: steps.children.outputs.ready == 'true'
        env:
          WORKFLOW_SHA: ${{ needs.resolve.outputs.workflow_sha }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin refs/heads/main
          [ "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$WORKFLOW_SHA" ] || {
            echo "::error::Protected main moved before audited registry policy could be materialized."
            exit 1
          }
          classifier_spec="${WORKFLOW_SHA}:scripts/ci/classify_ghcr_release_absence.py"
          [ "$(git cat-file -t "$classifier_spec")" = blob ]
          expected_blob="$(git rev-parse --verify "$classifier_spec")"
          policy_root="$(mktemp -d "$RUNNER_TEMP/audited-workflow-policy.XXXXXX")"
          classifier_path="$policy_root/classify_ghcr_release_absence.py"
          git show "$classifier_spec" > "$classifier_path"
          [ "$(git hash-object "$classifier_path")" = "$expected_blob" ] || {
            echo "::error::Materialized registry policy does not match the audited workflow revision."
            exit 1
          }
          echo "AUDITED_GHCR_ABSENCE_CLASSIFIER=$classifier_path" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        if: steps.children.outputs.ready == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to fork-owned GHCR
        if: always()
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up ORAS for release-lifetime receipt attachment
        if: always()
        uses: oras-project/setup-oras@0d9191fa0dd41eaefe9e28b375a02290706ce51d # upstream-main-2026-08-06
        with:
          version: ${{ env.ORAS_VERSION }}

      - name: Preflight and create recoverable multi-architecture tags
        if: steps.children.outputs.ready == 'true'
        id: manifest
        env:
          REBUILD: ${{ needs.registry-preflight.outputs.rebuild }}
          RECEIPT_PATH: ${{ runner.temp }}/ghcr-execution-read-receipt.json
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          SOURCE_REF: ${{ needs.resolve.outputs.source_ref }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          WORKFLOW_SHA: ${{ needs.resolve.outputs.workflow_sha }}
          MAINTENANCE: ${{ needs.resolve.outputs.maintenance }}
        run: |
          set -euo pipefail
          [ "$IMAGE_NAME" = "ghcr.io/ragnos-labs/hermes-agent" ]
          [ "$SOURCE_REF" = "refs/tags/${RELEASE_TAG}" ]

          record_failure() {
            local status="$1"
            local state="$2"
            local instruction="$3"
            RECEIPT_PATH="$RECEIPT_PATH" \
            RECEIPT_STATUS="$status" \
            RECOVERY_INSTRUCTION="$instruction" \
            RECOVERY_STATE="$state" \
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["RECEIPT_PATH"])
          receipt = json.loads(path.read_text(encoding="utf-8"))
          receipt["status"] = os.environ["RECEIPT_STATUS"]
          receipt["recovery"] = {
              "state": os.environ["RECOVERY_STATE"],
              "instruction": os.environ["RECOVERY_INSTRUCTION"],
          }
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          }

          prove_source_tag() {
            git fetch --force --no-tags origin refs/heads/main
            current_main="$(git rev-parse 'FETCH_HEAD^{commit}')"
            [ "$current_main" = "$WORKFLOW_SHA" ] || {
              record_failure \
                "workflow_revision_stale" \
                "main_moved" \
                "No further image tag mutation is allowed. Stop for fresh governance against current protected main."
              echo "::error::main moved to $current_main; audited workflow revision is $WORKFLOW_SHA."
              exit 1
            }
            if ! git fetch --force --no-tags origin "$SOURCE_REF"; then
              record_failure \
                "source_tag_unavailable" \
                "moved_or_missing_tag" \
                "No image tag was created. Stop and reconcile the exact protected CalVer source tag."
              echo "::error::CalVer source tag is unavailable: $SOURCE_REF"
              exit 1
            fi
            resolved_sha="$(git rev-parse 'FETCH_HEAD^{commit}')"
            [ "$resolved_sha" = "$SOURCE_SHA" ] || {
              record_failure \
                "source_tag_moved" \
                "moved_tag" \
                "No further image tag mutation is allowed. Reconcile the moved CalVer source tag with the pilot."
              echo "::error::CalVer source tag moved to $resolved_sha; expected $SOURCE_SHA."
              exit 1
            }
            if [ "$MAINTENANCE" = true ]; then
              [ "$SOURCE_SHA" = "$MAINTENANCE_SOURCE_SHA" ]
              [ "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$MAINTENANCE_SOURCE_TREE" ]
            else
              git merge-base --is-ancestor "$SOURCE_SHA" "$WORKFLOW_SHA" || {
                record_failure \
                  "source_not_ancestor_of_workflow" \
                  "invalid_ancestry" \
                  "No further image tag mutation is allowed. SOURCE_SHA must be an ancestor of WORKFLOW_SHA/current protected main."
                echo "::error::SOURCE_SHA is not an ancestor of WORKFLOW_SHA/current main."
                exit 1
              }
            fi
          }

          inspect_ref() {
            local ref="$1" raw_path="$2" digest_path="$3" state_path="$4"
            local attempt raw_tmp digest_tmp error_path saw_unknown=false
            rm -f "$raw_path" "$digest_path" "$state_path"
            error_path="${raw_path}.error"
            for attempt in 1 2 3; do
              raw_tmp="${raw_path}.attempt-${attempt}"
              digest_tmp="${digest_path}.attempt-${attempt}"
              : > "$error_path"
              if timeout 45 docker buildx imagetools inspect "$ref" --raw > "$raw_tmp" 2> "$error_path"; then
                if timeout 45 docker buildx imagetools inspect "$ref" > "$digest_tmp" 2>> "$error_path" && \
                  RAW_PATH="$raw_tmp" DIGEST_OUTPUT="$digest_tmp" python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          payload = json.loads(Path(os.environ["RAW_PATH"]).read_text(encoding="utf-8"))
          assert isinstance(payload, dict) and payload, "malformed registry manifest"
          text = Path(os.environ["DIGEST_OUTPUT"]).read_text(encoding="utf-8")
          match = re.search(r"(?m)^Digest:\s+(sha256:[0-9a-f]{64})\s*$", text)
          assert match, "missing canonical registry digest"
          Path(os.environ["DIGEST_OUTPUT"]).write_text(match.group(1) + "\n", encoding="utf-8")
          PY
                then
                  mv "$raw_tmp" "$raw_path"
                  mv "$digest_tmp" "$digest_path"
                  echo present > "$state_path"
                  rm -f "$error_path"
                  return 0
                fi
                saw_unknown=true
              elif python3 "$AUDITED_GHCR_ABSENCE_CLASSIFIER" "$error_path"; then
                rm -f "$raw_tmp" "$digest_tmp"
                if [ "$attempt" -eq 3 ] && [ "$saw_unknown" = false ]; then
                  echo absent > "$state_path"
                  rm -f "$error_path"
                  return 0
                fi
              else
                saw_unknown=true
                rm -f "$raw_tmp" "$digest_tmp"
              fi
              echo "::warning::Authenticated registry inspection attempt ${attempt}/3 was not conclusive for ${ref}."
              sleep "$attempt"
            done
            rm -f "$error_path"
            return 1
          }

          assert_ref_unchanged() {
            local ref="$1"
            local expected_state="$2"
            local expected_digest="$3"
            local key current_state current_digest raw_path digest_path state_path
            key="$(printf '%s' "$ref" | sha256sum | cut -d' ' -f1)"
            raw_path="$RUNNER_TEMP/assert-${key}.json"
            digest_path="$RUNNER_TEMP/assert-${key}.digest"
            state_path="$RUNNER_TEMP/assert-${key}.state"
            inspect_ref "$ref" "$raw_path" "$digest_path" "$state_path" || {
              record_failure \
                "registry_inspection_unknown" \
                "tag_state_unknown" \
                "Registry authentication, timeout, outage, or malformed output prevented an exact unchanged assertion. No mutation is allowed."
              exit 1
            }
            current_state="$(<"$state_path")"
            if test -f "$digest_path"; then
              current_digest="$(<"$digest_path")"
            else
              current_digest=""
            fi
            if [ "$expected_state" = "matching" ]; then
              [ "$current_state" = present ] && [ "$current_digest" = "$expected_digest" ] || {
                record_failure registry_state_changed tag_race "Stop publication and reconcile the changed or missing GHCR tag against the authenticated preflight receipt."
                exit 1
              }
            else
              [ "$expected_state" = absent ] && [ "$current_state" = absent ] || {
                record_failure registry_state_changed tag_race "Stop publication and reconcile the unexpectedly present GHCR tag against the authenticated preflight receipt."
                exit 1
              }
            fi
          }

          reconcile_delivery_failure() {
            local operation="$1" target_ref="$2" expected_digest="$3" create_rc="$4"
            local raw_path="$RUNNER_TEMP/delivery-reinspect.json"
            local digest_path="$RUNNER_TEMP/delivery-reinspect.digest"
            local state_path="$RUNNER_TEMP/delivery-reinspect.state"
            local status=delivery_unknown state=delivery_unknown actual_digest=""
            if inspect_ref "$target_ref" "$raw_path" "$digest_path" "$state_path"; then
              if [ "$(<"$state_path")" = present ]; then
                actual_digest="$(<"$digest_path")"
                if [ -n "$expected_digest" ] && [ "$actual_digest" = "$expected_digest" ]; then
                  status=delivered_after_transport_error
                  state=delivery_confirmed
                fi
              else
                status=delivery_failed_confirmed_absent
                state=confirmed_absent
              fi
            fi
            if [ "$create_rc" -eq 124 ] && [ "$status" = delivery_unknown ]; then
              status=timed_out_unknown
              state=timed_out_unknown
            fi
            RECEIPT_PATH="$RECEIPT_PATH" DELIVERY_STATUS="$status" DELIVERY_STATE="$state" \
            DELIVERY_OPERATION="$operation" DELIVERY_TARGET="$target_ref" \
            DELIVERY_EXPECTED_DIGEST="$expected_digest" DELIVERY_ACTUAL_DIGEST="$actual_digest" \
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["RECEIPT_PATH"])
          receipt = json.loads(path.read_text(encoding="utf-8"))
          receipt["status"] = os.environ["DELIVERY_STATUS"]
          receipt["delivery"] = {
              "operation": os.environ["DELIVERY_OPERATION"],
              "target": os.environ["DELIVERY_TARGET"],
              "expected_digest": os.environ["DELIVERY_EXPECTED_DIGEST"] or None,
              "reinspected_digest": os.environ["DELIVERY_ACTUAL_DIGEST"] or None,
              "state": os.environ["DELIVERY_STATE"],
          }
          if os.environ["DELIVERY_OPERATION"].startswith("create_sha") and os.environ["DELIVERY_ACTUAL_DIGEST"]:
              receipt["index_digest"] = os.environ["DELIVERY_ACTUAL_DIGEST"]
          receipt["recovery"] = {
              "state": os.environ["DELIVERY_STATE"],
              "instruction": "Do not retry. Reinspect both destination tags and stop for fresh governance.",
          }
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          }

          create_tag() {
            local operation="$1" target_ref="$2" expected_digest="$3"
            shift 3
            local rc=0
            set +e
            timeout 120 docker buildx imagetools create "$@"
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              reconcile_delivery_failure "$operation" "$target_ref" "$expected_digest" "$rc"
              return "$rc"
            fi
          }

          recheck_maintenance_candidate_absence() {
            [ "$MAINTENANCE" = true ] || return 0
            local active_versions="$RUNNER_TEMP/maintenance-action-time-active-versions.json"
            local deleted_versions="$RUNNER_TEMP/maintenance-action-time-deleted-versions.json"
            # Last GET-only package inventory reads before the first manifest
            # tag mutation. API, pagination, shape, or collision ambiguity is
            # terminal for this sole attempt.
            gh api --paginate --slurp \
              "orgs/ragnos-labs/packages/container/hermes-agent/versions?state=active&per_page=100" \
              > "$active_versions"
            gh api --paginate --slurp \
              "orgs/ragnos-labs/packages/container/hermes-agent/versions?state=deleted&per_page=100" \
              > "$deleted_versions"
            ACTIVE_VERSIONS="$active_versions" DELETED_VERSIONS="$deleted_versions" \
            RELEASE_TAG="$RELEASE_TAG" python3 - <<'PY'
          import json
          import os

          def versions(name):
              pages = json.load(open(os.environ[name], encoding="utf-8"))
              assert isinstance(pages, list)
              values = []
              for page in pages:
                  assert isinstance(page, list)
                  values.extend(page)
              return values

          for state in ("ACTIVE_VERSIONS", "DELETED_VERSIONS"):
              for version in versions(state):
                  assert isinstance(version, dict)
                  tags = version.get("metadata", {}).get("container", {}).get("tags", [])
                  assert isinstance(tags, list)
                  assert os.environ["RELEASE_TAG"] not in tags, (state, version.get("id"))
          PY
          }

          prove_source_tag
          sha_ref="${IMAGE_NAME}:sha-${SOURCE_SHA}"
          release_ref="${IMAGE_NAME}:${RELEASE_TAG}"
          initial_sha_state="$(jq -r '.tag_states.preflight.sha.state' "$RECEIPT_PATH")"
          initial_sha_digest="$(jq -r '.tag_states.preflight.sha.digest // ""' "$RECEIPT_PATH")"
          initial_release_state="$(jq -r '.tag_states.preflight.release.state' "$RECEIPT_PATH")"
          initial_release_digest="$(jq -r '.tag_states.preflight.release.digest // ""' "$RECEIPT_PATH")"
          assert_ref_unchanged "$sha_ref" "$initial_sha_state" "$initial_sha_digest"
          assert_ref_unchanged "$release_ref" "$initial_release_state" "$initial_release_digest"

          sources=()
          if [ "$REBUILD" = true ]; then
            amd64_index="$(jq -r '.children.amd64.build_index_digest' "$RECEIPT_PATH")"
            arm64_index="$(jq -r '.children.arm64.build_index_digest' "$RECEIPT_PATH")"
            amd64_runtime="$(jq -r '.children.amd64.runtime_digest' "$RECEIPT_PATH")"
            arm64_runtime="$(jq -r '.children.arm64.runtime_digest' "$RECEIPT_PATH")"
            for digest in "$amd64_index" "$arm64_index" "$amd64_runtime" "$arm64_runtime"; do
              [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            done
            sources=("${IMAGE_NAME}@${amd64_index}" "${IMAGE_NAME}@${arm64_index}")
          else
            existing_digest="$initial_sha_digest"
            [ -n "$existing_digest" ] || existing_digest="$initial_release_digest"
            [[ "$existing_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            docker buildx imagetools inspect "${IMAGE_NAME}@${existing_digest}" --raw > "$RUNNER_TEMP/existing-exact-manifest.json"
            read -r amd64_runtime arm64_runtime < <(
              MANIFEST_JSON="$RUNNER_TEMP/existing-exact-manifest.json" python3 - <<'PY'
          import json
          import os
          payload = json.load(open(os.environ["MANIFEST_JSON"], encoding="utf-8"))
          runtime = {
              (item.get("platform", {}).get("os"), item.get("platform", {}).get("architecture")): item.get("digest")
              for item in payload.get("manifests", []) if item.get("platform", {}).get("os") == "linux"
          }
          assert set(runtime) == {("linux", "amd64"), ("linux", "arm64")}, runtime
          print(runtime[("linux", "amd64")], runtime[("linux", "arm64")])
          PY
            )
          fi
          [[ "$amd64_runtime" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$arm64_runtime" =~ ^sha256:[0-9a-f]{64}$ ]]
          [ "$amd64_runtime" != "$arm64_runtime" ]

          sha_raw="$RUNNER_TEMP/preflight-sha.json"
          sha_digest_path="$RUNNER_TEMP/preflight-sha.digest"
          sha_state_path="$RUNNER_TEMP/preflight-sha.state"
          release_raw="$RUNNER_TEMP/preflight-release.json"
          release_digest_path="$RUNNER_TEMP/preflight-release.digest"
          release_state_path="$RUNNER_TEMP/preflight-release.state"
          plan_path="$RUNNER_TEMP/publication-plan.json"
          inspect_ref "$sha_ref" "$sha_raw" "$sha_digest_path" "$sha_state_path" || {
            record_failure registry_inspection_unknown sha_inspection_unknown "Authenticated SHA-tag reinspection was inconclusive; no tag mutation is allowed."
            exit 1
          }
          inspect_ref "$release_ref" "$release_raw" "$release_digest_path" "$release_state_path" || {
            record_failure registry_inspection_unknown release_inspection_unknown "Authenticated release-tag reinspection was inconclusive; no tag mutation is allowed."
            exit 1
          }

          AMD64_RUNTIME="$amd64_runtime" \
          ARM64_RUNTIME="$arm64_runtime" \
          PLAN_PATH="$plan_path" \
          RECEIPT_PATH="$RECEIPT_PATH" \
          RELEASE_DIGEST_PATH="$release_digest_path" \
          RELEASE_RAW="$release_raw" \
          SHA_DIGEST_PATH="$sha_digest_path" \
          SHA_RAW="$sha_raw" \
          SOURCE_SHA="$SOURCE_SHA" \
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected_runtime = {
              ("linux", "amd64"): os.environ["AMD64_RUNTIME"],
              ("linux", "arm64"): os.environ["ARM64_RUNTIME"],
          }

          def classify(raw_name, digest_name):
              raw_path = Path(os.environ[raw_name])
              if not raw_path.is_file():
                  return {"state": "absent", "digest": None}
              payload = json.loads(raw_path.read_text(encoding="utf-8"))
              manifests = payload.get("manifests", [])
              runtime = {
                  (item.get("platform", {}).get("os"), item.get("platform", {}).get("architecture")): item["digest"]
                  for item in manifests
                  if item.get("platform", {}).get("os") == "linux"
              }
              attested = {
                  item.get("annotations", {}).get("vnd.docker.reference.digest")
                  for item in manifests
                  if item.get("annotations", {}).get("vnd.docker.reference.type") == "attestation-manifest"
              }
              annotations = payload.get("annotations", {})
              matches = (
                  runtime == expected_runtime
                  and set(expected_runtime.values()).issubset(attested)
                  and annotations.get("org.opencontainers.image.revision") == os.environ["SOURCE_SHA"]
                  and annotations.get("io.ragnos.hermes.execution.contract") == "hermes.execution.read.v1"
                  and annotations.get("io.ragnos.hermes.execution.schema-sha256")
                  == "7b2c4569d52a048c31a5a42861817b748e5742ce6cac6eafba1d41dc090340c3"
                  and annotations.get("io.ragnos.hermes.execution.action-contract")
                  == "hermes.execution.action.v1"
                  and annotations.get("io.ragnos.hermes.execution.action-schema-sha256")
                  == os.environ["ACTION_SCHEMA_SHA256"]
                  and annotations.get("io.ragnos.hermes.execution.action-source-sha")
                  == os.environ["SOURCE_SHA"]
              )
              digest = Path(os.environ[digest_name]).read_text(encoding="utf-8").strip()
              return {"state": "matching" if matches else "conflict", "digest": digest}

          sha = classify("SHA_RAW", "SHA_DIGEST_PATH")
          release = classify("RELEASE_RAW", "RELEASE_DIGEST_PATH")
          actions = []
          errors = []
          if release["state"] == "conflict":
              errors.append("release tag conflicts")
          if sha["state"] == "conflict":
              errors.append("SHA tag conflicts")
          if sha["state"] == release["state"] == "matching" and sha["digest"] != release["digest"]:
              errors.append("matching-content tags resolve to different index digests")
          if not errors:
              if release["state"] == "matching" and sha["state"] == "absent":
                  actions.append("create_sha_from_release")
              elif sha["state"] == "absent":
                  actions.append("create_sha_from_children")
              if release["state"] == "absent":
                  actions.append("create_release_from_sha")

          plan = {"sha": sha, "release": release, "actions": actions, "errors": errors}
          Path(os.environ["PLAN_PATH"]).write_text(
              json.dumps(plan, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          receipt_path = Path(os.environ["RECEIPT_PATH"])
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          receipt["tag_states"]["preflight"] = {"sha": sha, "release": release}
          receipt["status"] = "conflict" if errors else "preflight_passed"
          if errors:
              receipt["recovery"] = {
                  "state": "conflict",
                  "instruction": "Do not mutate either tag. Reconcile the conflicting digest with this receipt and obtain a new pilot decision.",
              }
          receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(plan, indent=2, sort_keys=True))
          if errors:
              raise SystemExit("; ".join(errors))
          PY

          sha_state="$(jq -r '.sha.state' "$plan_path")"
          sha_preflight_digest="$(jq -r '.sha.digest // ""' "$plan_path")"
          release_state="$(jq -r '.release.state' "$plan_path")"
          release_preflight_digest="$(jq -r '.release.digest // ""' "$plan_path")"

          if jq -e '.actions | index("create_sha_from_children")' "$plan_path" >/dev/null; then
            prove_source_tag
            assert_ref_unchanged "$release_ref" "$release_state" "$release_preflight_digest"
            assert_ref_unchanged "$sha_ref" "$sha_state" "$sha_preflight_digest"
            recheck_maintenance_candidate_absence
            create_tag create_sha_from_children "$sha_ref" "" \
              --annotation "index:org.opencontainers.image.revision=${SOURCE_SHA}" \
              --annotation "index:io.ragnos.hermes.execution.contract=${CONTRACT_VERSION}" \
              --annotation "index:io.ragnos.hermes.execution.schema-sha256=${SCHEMA_SHA256}" \
              --annotation "index:io.ragnos.hermes.execution.action-contract=${ACTION_CONTRACT_VERSION}" \
              --annotation "index:io.ragnos.hermes.execution.action-schema-sha256=${ACTION_SCHEMA_SHA256}" \
              --annotation "index:io.ragnos.hermes.execution.action-source-sha=${SOURCE_SHA}" \
              --tag "$sha_ref" \
              "${sources[@]}"
          elif jq -e '.actions | index("create_sha_from_release")' "$plan_path" >/dev/null; then
            prove_source_tag
            assert_ref_unchanged "$release_ref" "$release_state" "$release_preflight_digest"
            assert_ref_unchanged "$sha_ref" "$sha_state" "$sha_preflight_digest"
            recheck_maintenance_candidate_absence
            create_tag create_sha_from_release "$sha_ref" "$release_preflight_digest" \
              --tag "$sha_ref" "${IMAGE_NAME}@${release_preflight_digest}"
          else
            assert_ref_unchanged "$sha_ref" "$sha_state" "$sha_preflight_digest"
          fi

          inspect_ref "$sha_ref" "$RUNNER_TEMP/verified-sha.json" "$RUNNER_TEMP/verified-sha.digest" "$RUNNER_TEMP/verified-sha.state" || {
            record_failure registry_inspection_unknown sha_delivery_unknown "SHA tag delivery could not be proved after bounded authenticated reinspection."
            exit 1
          }
          [ "$(<"$RUNNER_TEMP/verified-sha.state")" = present ] || {
            record_failure sha_tag_absent sha_delivery_absent "SHA tag is absent after finalization; preserve evidence and stop for fresh governance."
            exit 1
          }
          sha_digest="$(<"$RUNNER_TEMP/verified-sha.digest")"
          [[ "$sha_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          AMD64_RUNTIME="$amd64_runtime" \
          ARM64_RUNTIME="$arm64_runtime" \
          MANIFEST_JSON="$RUNNER_TEMP/verified-sha.json" \
          RECEIPT_PATH="$RECEIPT_PATH" \
          SOURCE_SHA="$SOURCE_SHA" \
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.load(open(os.environ["MANIFEST_JSON"], encoding="utf-8"))
          manifests = payload.get("manifests", [])
          expected_runtime = {
              ("linux", "amd64"): os.environ["AMD64_RUNTIME"],
              ("linux", "arm64"): os.environ["ARM64_RUNTIME"],
          }
          actual_runtime = {
              (item.get("platform", {}).get("os"), item.get("platform", {}).get("architecture")): item["digest"]
              for item in manifests
              if item.get("platform", {}).get("os") == "linux"
          }
          attested = {
              item.get("annotations", {}).get("vnd.docker.reference.digest")
              for item in manifests
              if item.get("annotations", {}).get("vnd.docker.reference.type") == "attestation-manifest"
          }
          annotations = payload.get("annotations", {})
          valid = (
              actual_runtime == expected_runtime
              and set(expected_runtime.values()).issubset(attested)
              and annotations.get("org.opencontainers.image.revision") == os.environ["SOURCE_SHA"]
              and annotations.get("io.ragnos.hermes.execution.contract") == "hermes.execution.read.v1"
              and annotations.get("io.ragnos.hermes.execution.schema-sha256")
              == "7b2c4569d52a048c31a5a42861817b748e5742ce6cac6eafba1d41dc090340c3"
              and annotations.get("io.ragnos.hermes.execution.action-contract")
              == "hermes.execution.action.v1"
              and annotations.get("io.ragnos.hermes.execution.action-schema-sha256")
              == os.environ["ACTION_SCHEMA_SHA256"]
              and annotations.get("io.ragnos.hermes.execution.action-source-sha")
              == os.environ["SOURCE_SHA"]
          )
          if not valid:
              receipt_path = Path(os.environ["RECEIPT_PATH"])
              receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
              receipt["status"] = "sha_verification_failed"
              receipt["recovery"] = {
                  "state": "orphan_sha_tag",
                  "instruction": "Do not create the release tag. Reconcile the SHA tag descriptors and attestations against this receipt.",
              }
              receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
              raise SystemExit("SHA manifest failed runtime, attestation, or annotation verification")
          PY
          RECEIPT_PATH="$RECEIPT_PATH" SHA_DIGEST="$sha_digest" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["RECEIPT_PATH"])
          receipt = json.loads(path.read_text(encoding="utf-8"))
          receipt["status"] = "sha_ready"
          receipt["index_digest"] = os.environ["SHA_DIGEST"]
          receipt["recovery"] = {
              "state": "resume_release_tag",
              "instruction": "If the release tag is absent, preserve the matching SHA tag and stop for fresh governance.",
          }
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

          if jq -e '.actions | index("create_release_from_sha")' "$plan_path" >/dev/null; then
            prove_source_tag
            assert_ref_unchanged "$sha_ref" "matching" "$sha_digest"
            assert_ref_unchanged "$release_ref" "$release_state" "$release_preflight_digest"
            recheck_maintenance_candidate_absence
            create_tag create_release_from_sha "$release_ref" "$sha_digest" \
              --tag "$release_ref" "${IMAGE_NAME}@${sha_digest}"
          fi

          inspect_ref "$release_ref" "$RUNNER_TEMP/final-release-tag.json" "$RUNNER_TEMP/final-release.digest" "$RUNNER_TEMP/final-release.state" || {
            record_failure registry_inspection_unknown release_delivery_unknown "Release tag delivery could not be proved after bounded authenticated reinspection."
            exit 1
          }
          [ "$(<"$RUNNER_TEMP/final-release.state")" = present ] || {
            record_failure release_tag_absent release_delivery_absent "Release tag is absent after finalization; preserve the verified SHA tag and stop for fresh governance."
            exit 1
          }
          final_release_digest="$(<"$RUNNER_TEMP/final-release.digest")"
          [ "$final_release_digest" = "$sha_digest" ]
